name: fix_sbe
title: FIX Simple Binary Encoding (SBE)
description: 'A LinkML model of FIX Simple Binary Encoding, a standard from the FIX Trading Community
  for encoding messages in binary. It describes SBE message schemas: encodings, message templates, fields,
  groups and variable-length data. The two editions differ on the wire and in their XML, so each has a
  module of its own.'
version: 1.0 and 2.0-rc3
source: https://github.com/FIXTradingCommunity/fix-simple-binary-encoding
license: Apache-2.0
keywords:
- FIX
- SBE
- binary encoding
- message schema
- wire format
see_also:
- https://lmodel.github.io/fix-sbe
- https://github.com/FIXTradingCommunity/fix-simple-binary-encoding
- https://www.iana.org/assignments/media-types/application/sbe
annotations:
  upstream_v1_tag: v1.0-errata-Nov-2020
  upstream_v1_commit: 6321e6b9bce5bc198f88f462054cbaf4f33d8f60
  upstream_v2_commit: 418a8f6a8b93c65b308638dab2bc6a35dddcd864
