- A document of SBE 1.0 starts at SbeMessageSchemaV1, the tree root, and one of SBE 2.0 RC3 at SbeMessageSchemaV2.
  upstream/ holds both XSDs unchanged, tests/test_coverage.py compares the modules with them, and scripts/check_upstream_release.py
  reports when either changes.
