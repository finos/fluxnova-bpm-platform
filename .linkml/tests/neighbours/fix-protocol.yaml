    slot_uri: fix_protocol:in_section
    range: FixSection
    pattern: ^fix_section:[A-Za-z][A-Za-z0-9_]*$
    aliases:
    - section
    exact_mappings:
    - fixr:section
  in_category:
    title: Category
    description: The category a message, component or group belongs to.
    slot_uri: fix_protocol:in_category
    range: FixCategory
    pattern: ^fix_category:[A-Za-z][A-Za-z0-9_]*$
    required: true
    aliases:
    - category
    exact_mappings:
    - fixr:category
  fix_members:
    title: Members
    description: The fields, components and groups the element holds, in the order FIX lists them.
    slot_uri: fix_protocol:fix_members
    range: FixMember
    multivalued: true
    inlined_as_list: true
    comments:
    - A message lists its members in a structure element and a component or a group lists them directly.
      The record lists them here in each case.
enums:
  FixPresence:
    title: Presence
    description: Whether a message, component or group must carry a member, in the terms Orchestra 1.0
      defines.
    comments:
    - FIX Latest states only required. A member with no presence is optional, which is Orchestra 1.0's
      default.
    permissible_values:
      optional:
        title: Optional
        description: The member may be left out.
      required:
        title: Required
        description: The member must be there.
      forbidden:
        title: Forbidden
        description: The member must be left out.
      ignored:
        title: Ignored
        description: A receiver disregards the member if it is there.
      constant:
        title: Constant
        description: The member always takes one fixed value.
  FixCategoryKind:
    title: Category Kind
    description: Whether a category groups messages or fields.
    permissible_values:
      Message:
        title: Messages
        description: The category groups messages and their components.
      Field:
        title: Fields
        description: The category groups fields.
  FixIncludeFile:
    title: Included FIXML File
    description: Which shared FIXML schema file a category's own FIXML schema file brings in.
    permissible_values:
      components:
        title: Components
        description: The file that defines the shared components.
      fields:
        title: Fields
        description: The file that defines the fields.
types:
  fix_version:
    title: FIX Version
    description: A FIX version, such as FIX.4.4, FIX.5.0SP2 or FIX.Latest.
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(FIX\.2\.7|FIX\.3\.0|FIX\.4\.[0-4]|(FIX\.Latest|FIX\.5\.0(SP[0-9]{1,2})?)(_EP(9[89]|[1-9][0-9]{2}))?|FIXT\.1\.1|[0-9]+\.[0-9]+|[0-9]{8})$
    exact_mappings:
    - fixr:Version_t
    comments:
    - The pattern is Orchestra 1.0's for a version, anchored at both ends.
  fix_extension_pack:
    title: Extension Pack Number
    description: The number of a FIX extension pack. FIX Latest changes one extension pack at a time.
    typeof: integer
    base: int
    uri: xsd:integer
    minimum_value: -1
    exact_mappings:
    - fixr:EP_t
    comments:
    - FIX Latest writes -1 on some elements that FIX 4.4 and FIX 5.0 added, and states nothing about what
      the value means.
  fix_date:
    title: Date
    description: A date as the repository's metadata writes it, year first.
    typeof: string
    base: str
    uri: xsd:date
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    comments:
    - LinkML's date type relies on a JSON Schema format checker, which many validators do not enable.
  fix_name:
    title: FIX Name
    description: 'A name as FIX writes one: a letter, then letters, digits and underscores.'
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[A-Za-z][A-Za-z0-9_]{0,254}$
    exact_mappings:
    - fixr:Name_t
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: FixElement; dropped for LOKF''s: id; folded
  into LOKF''s: name -> title; kept from folding: FixRepository.metadata_source.'
