    slot_uri: fix_protocol:deprecated_in
    range: fix_version
    aliases:
    - deprecated
    exact_mappings:
    - fixr:deprecated
  deprecated_in_ep:
    title: Deprecated In Extension Pack
    description: The extension pack that deprecated the element.
    slot_uri: fix_protocol:deprecated_in_ep
    range: fix_extension_pack
    aliases:
    - deprecatedEP
    exact_mappings:
    - fixr:deprecatedEP
