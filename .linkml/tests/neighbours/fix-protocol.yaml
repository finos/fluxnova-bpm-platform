id: https://w3id.org/lmodel/fix-protocol-lokf
name: fix-protocol
title: FIX Latest
description: A LinkML model of FIX Latest, the application layer of the Financial Information eXchange
  (FIX) protocol that the FIX Trading Community maintains. It holds every section, category, datatype,
  code set, field, component, repeating group and message of FIX Latest as a record, with the version
  and extension pack that added and last changed each one. The records keep FIX's names, numbers and codes
  and none of its descriptive text.
version: FIX.Latest_EP312
source: https://github.com/FIXTradingCommunity/orchestrations/blob/cd24169a2abd8daba7c360987c7a46ca11873a12/FIX%20Standard/OrchestraFIXLatest.xml
license: Apache-2.0
keywords:
- FIX
- FIX Latest
- financial messaging
- trading
- Orchestra
see_also:
- https://lmodel.github.io/fix-protocol
- https://github.com/FIXTradingCommunity/orchestrations
annotations:
  upstream_repository: https://github.com/FIXTradingCommunity/orchestrations
  upstream_commit: cd24169a2abd8daba7c360987c7a46ca11873a12
  upstream_created: '2026-09-08'
  upstream_license: Apache-2.0
comments:
- The version is the extension pack the catalogue renders. upstream/ holds FIX Latest's Orchestra file
  unchanged, scripts/fix_latest_to_records.py writes the catalogue from it, and scripts/check_upstream_release.py
  reports when FIX publishes another.
prefixes:
  fix_protocol: https://w3id.org/lmodel/fix-protocol/
  fix_section: https://w3id.org/lmodel/fix-protocol/section/
  fix_category: https://w3id.org/lmodel/fix-protocol/category/
  fix_orchestra: https://w3id.org/lmodel/fix-orchestra/
  fixr: http://fixprotocol.io/2020/orchestra/repository/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  fix_datatype: https://w3id.org/lmodel/fix-protocol/datatype/
  fix_code_set: https://w3id.org/lmodel/fix-protocol/code_set/
  fix_code: https://w3id.org/lmodel/fix-protocol/code/
  fix_field: https://w3id.org/lmodel/fix-protocol/field/
  fix_component: https://w3id.org/lmodel/fix-protocol/component/
  fix_group: https://w3id.org/lmodel/fix-protocol/group/
  fix_message: https://w3id.org/lmodel/fix-protocol/message/
  dcterms: http://purl.org/dc/terms/
default_prefix: fix_protocol
default_range: string
imports:
- linkml:types
- lokf
classes:
  FixPedigreeMixin:
    title: Pedigree
    description: When FIX added, last changed and deprecated an element, by version and extension pack.
    mixin: true
    slots:
    - added_in
    - added_in_ep
    - updated_in
    - updated_in_ep
    - deprecated_in
    - deprecated_in_ep
  FixElement:
    title: FIX Element
    description: An element of FIX Latest with an identifier and a name of its own.
    abstract: true
    mixins:
    - FixPedigreeMixin
    slots:
    - id
    - title
    slot_usage:
      title:
        required: true
        range: fix_name
    is_a: Concept
  FixSection:
    title: Section
    description: One of the five parts FIX divides its messages into by business area, such as PreTrade.
    is_a: FixElement
    slots:
    - fixml_file_name
    - fixml_not_required
    attributes:
      section_order:
        title: Display Order
        description: Where the section comes in FIX's own order of sections, counting from 0.
        range: integer
        minimum_value: 0
