        description: The standard the type belongs to, such as XML.
        required: true
        aliases:
        - standard
        exact_mappings:
        - fixr:standard
      mapped_base:
        title: Base
        description: The standard's type, such as xs:decimal.
        aliases:
        - base
        exact_mappings:
        - fixr:base
      mapped_builtin:
        title: Built In
        description: True when the type is one the standard defines itself.
        range: boolean
        aliases:
        - builtin
        exact_mappings:
        - fixr:builtin
      mapped_min_inclusive:
        title: Least Value
        description: The smallest value the type allows, as FIX writes it.
        aliases:
