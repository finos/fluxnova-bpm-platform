      code_value:
        title: Value
        description: The value as it travels on the wire.
        required: true
        pattern: ^\S+$
        aliases:
        - value
        exact_mappings:
        - fixr:value
      sort_order:
        title: Sort Order
        description: Where the code comes when FIX lists the set.
        range: integer
