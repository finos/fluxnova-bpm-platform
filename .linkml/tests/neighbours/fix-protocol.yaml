    range: fix_extension_pack
    aliases:
    - addedEP
    exact_mappings:
    - fixr:addedEP
  updated_in:
    title: Last Updated In
    description: The FIX version that last changed the element.
    slot_uri: fix_protocol:updated_in
    range: fix_version
    aliases:
    - updated
    exact_mappings:
    - fixr:updated
  updated_in_ep:
    title: Last Updated In Extension Pack
