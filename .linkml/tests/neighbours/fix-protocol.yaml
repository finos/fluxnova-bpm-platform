    is_a: FixElement
    slots:
    - fixml_file_name
    - in_section
    - fixml_not_required
    attributes:
      category_kind:
        title: Category Kind
        description: Whether the category groups messages or fields.
        range: FixCategoryKind
        aliases:
        - componentType
        exact_mappings:
        - fixr:componentType
      include_file:
        title: Included FIXML File
        description: The shared FIXML schema file that the category's own FIXML schema file brings in.
        range: FixIncludeFile
        aliases:
        - includeFile
        exact_mappings:
        - fixr:includeFile
    slot_usage:
      id: {}
    exact_mappings:
    - fix_orchestra:OrchestraCategoryV10
    - fixr:categoryType
  FixDatatype:
    title: Datatype
    description: A kind of value a field holds, such as int, Price or UTCTimestamp, with the XML Schema
      types it maps to.
    is_a: FixElement
    attributes:
