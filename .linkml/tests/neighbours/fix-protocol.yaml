slots:
  abbr_name:
    title: Abbreviated Name
    description: The shorter name FIXML uses for the element's tag.
    slot_uri: fix_protocol:abbr_name
    range: fix_name
    aliases:
    - abbrName
    exact_mappings:
    - fixr:abbrName
  fixml_file_name:
    title: FIXML File Name
    description: The FIXML schema file that holds the section's or category's elements, by its file name.
    slot_uri: fix_protocol:fixml_file_name
    range: fix_name
    aliases:
    - FIXMLFileName
    exact_mappings:
    - fixr:FIXMLFileName
  fixml_not_required:
    title: Not Required in FIXML
    description: True when the element is left out of FIXML, FIX's XML encoding.
    slot_uri: fix_protocol:fixml_not_required
    range: boolean
    aliases:
    - notReqXML
    comments:
    - FIX Latest writes it in a FIXML annotation, the only kind of application information the file carries.
  added_in:
    title: Added In
    description: The FIX version that added the element.
    slot_uri: fix_protocol:added_in
    range: fix_version
    aliases:
    - added
    exact_mappings:
    - fixr:added
  added_in_ep:
    title: Added In Extension Pack
