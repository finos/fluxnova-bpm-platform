    description: The period the term applies over, such as an adequacy decision's.
    slot_uri: dcterms:temporal
    range: DpvInterval
    inlined: true
  transfers:
    title: transfers
    description: Indicates the specified event or action is transferred to another context or entity by
      this control
    slot_uri: risk:transfers
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    is_a: controls
  un_m49:
    title: UN-M49
    description: The UN-M49 code for a given region
    slot_uri: loc:un_m49
    range: string
    multivalued: true
  valid:
    title: dct:valid
    description: The property dcterms:valid.
    slot_uri: dcterms:valid
    range: string
    multivalued: true
    comments:
    - Also used for specifying the temporal validity of an activity associated with Right Exercise. For
      example, limits on duration for providing or accessing provided information
    - For expressing the temporal date or range of validity of the DPIA document or process. This refers
      to the time period for which the DPIA is considered valid, and does not refer to the temporal period
      associated with processing (see dct:temporal instead). The assumption is that after this period,
      the DPIA should be re-evaluated or some process should be triggered
  prefLabel:
    title: Preferred Label
    description: The term's label, in English where DPV states a language.
    slot_uri: skos:prefLabel
  prefLabel_de:
    title: Preferred Label in German
    description: The term's German label, which the German health data law states.
    slot_uri: skos:prefLabel
  dpv_definition:
    title: Definition
    description: The term's definition, in English where DPV states a language.
    slot_uri: skos:definition
    aliases:
    - definition
  definition_de:
    title: Definition in German
    description: The term's German definition, which the German health data law states.
    slot_uri: skos:definition
  scopeNote:
    title: Scope Note
    description: What DPV says about the term's scope.
    slot_uri: skos:scopeNote
    multivalued: true
  broader:
    title: Broader
    description: The terms directly above this one.
    slot_uri: skos:broader
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  related:
    title: Related
    description: Other vocabularies' terms DPV relates to this one.
    slot_uri: skos:related
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  inScheme:
    title: In Scheme
    description: The concept schemes that list the term.
    slot_uri: skos:inScheme
    range: DpvConceptScheme
    multivalued: true
    inlined: false
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
  dpv_sameAs:
    title: Same As
    description: A term DPV states as the same as this one, under skos:sameAs, which is not a SKOS term.
    slot_uri: skos:sameAs
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
    aliases:
    - sameAs
  isDefinedBy:
    title: Is Defined By
    description: The namespace of the vocabulary that defines the term.
    slot_uri: rdfs:isDefinedBy
    range: DpvVocabulary
    multivalued: true
    inlined: false
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
  subClassOf:
    title: Subclass Of
    description: The classes directly above the term.
    slot_uri: rdfs:subClassOf
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  subPropertyOf:
    title: Subproperty Of
    description: The properties directly above this one.
    slot_uri: rdfs:subPropertyOf
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  domainIncludes:
    title: Domain Includes
    description: Classes DPV names as usual subjects of the property, not as the only ones.
    slot_uri: dcam:domainIncludes
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  rangeIncludes:
    title: Range Includes
    description: Classes DPV names as usual values of the property, not as the only ones.
    slot_uri: dcam:rangeIncludes
    range: DpvTerm
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    inlined: false
    multivalued: true
  example:
    title: Example
    description: The DPV examples that show the term in use.
    slot_uri: vann:example
    range: DpvExample
    multivalued: true
    inlined: false
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
  exactMatch:
    title: Exact Match
    description: The address of the same thing elsewhere, as DPV writes it, typed xsd:anyURI.
    slot_uri: skos:exactMatch
    range: dpv_uri
    multivalued: true
  term_status:
    title: Term Status
    description: How DPV's editors mark the term's standing.
    slot_uri: sw:term_status
    range: DpvTermStatus
  value:
    title: Value
    description: The number DPV gives a level on a risk scale.
    slot_uri: rdf:value
    range: decimal
  source_page:
    title: Source Page
    description: The web pages DPV names as sources of the term.
    slot_uri: dcterms:source
    range: DpvWebPage
    multivalued: true
    inlined_as_list: true
  dpv_datatype:
    title: Datatype
    description: The literal's datatype, as a CURIE.
    range: uriorcurie
    pattern: ^[A-Za-z_][A-Za-z0-9_+.-]*:\S*$
    slot_uri: dpv_linkml:datatype
    aliases:
    - datatype
  statements:
    title: Statements
    description: What the record's keys cannot hold.
    range: DpvStatement
    multivalued: true
    inlined_as_list: true
  dpv_concepts:
    title: Concepts
    description: The family's concepts, each a record of its kinds.
    range: DpvConcept
    multivalued: true
    inlined_as_list: true
    slot_uri: dpv_linkml:concepts
    aliases:
    - concepts
enums:
  DpvTermStatus:
    title: Term Status
    description: How DPV's editors mark a term's standing.
    permissible_values:
      accepted:
        title: Accepted
        description: The Community Group has accepted the term.
      modified:
        title: Modified
        description: The term changed in a recent release.
      sunset:
        title: Sunset
        description: The term is on its way out of the vocabulary.
  DpvFamily:
    title: Family
    description: The parts of a release, one file each.
    permissible_values:
      core:
        title: Core
        description: The vocabulary at https://w3id.org/dpv and the terms it adopts from others.
      pd:
        title: Personal Data
        description: The personal data vocabulary.
      tech:
        title: Technology
        description: The technology vocabulary.
      ai:
        title: Artificial Intelligence
        description: The artificial intelligence vocabulary.
      risk:
        title: Risk
        description: The risk vocabulary.
      justifications:
        title: Justifications
        description: The justifications vocabulary.
      loc:
        title: Locations
        description: The locations vocabulary.
      legal:
        title: Laws and Authorities
        description: The legal vocabularies, of each jurisdiction and each EU law.
      sector:
        title: Sectors
        description: The sector vocabularies.
      standards:
        title: Standards
        description: The vocabularies of other standards.
      agents:
        title: Agents
        description: The contributors.
      examples:
        title: Examples
        description: The examples.
types:
  dpv_date:
    title: Date
    description: A date as DPV writes it, year first.
    typeof: string
    uri: xsd:date
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    comments:
    - LinkML's date type asks a JSON Schema format checker, which many validators leave off.
  dpv_uri:
    title: Address
    description: An address as DPV writes it, typed xsd:anyURI.
    typeof: string
    uri: xsd:anyURI
    pattern: ^[A-Za-z][A-Za-z0-9+.-]*:\S*$
    comments:
    - LinkML's uri type asks a JSON Schema format checker, which many validators leave off.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: DpvVocabulary, DpvConceptScheme, DpvAgent,
  DpvTerm, DpvExample, DpvCatalogue; dropped for LOKF''s: id, rdf_type; renamed, IRIs unchanged: name
  -> dpv_name, memberOf -> dpv_memberOf, url -> dpv_url, title -> dpv_title, description -> dpv_description,
  created -> dpv_created, publisher -> dpv_publisher, license -> dpv_license, source -> dpv_source, hasPart
  -> dpv_hasPart, isPartOf -> dpv_isPartOf, definition -> dpv_definition, sameAs -> dpv_sameAs, datatype
  -> dpv_datatype, concepts -> dpv_concepts; folded into LOKF''s: schema_version -> version; kept from
  folding: source, source_page, isPartOf, isDefinedBy, DpvWebPage.page_name, url.'
