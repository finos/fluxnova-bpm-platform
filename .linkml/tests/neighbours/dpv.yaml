    - temporal
    is_a: Concept
  DpvConcept:
    title: Concept
    is_a: DpvTerm
    class_uri: skos:Concept
    description: A term DPV states as a concept and a class. Its rdf_type names the concepts it is an
      instance of, each a class of this schema, where DPV states one.
    comments:
    - It holds the DPV properties some term of the vocabularies states. A thing a use case describes takes
      DpvResource, which holds them all.
    slots:
    - eu_aiact_hasRiskLevel
    - hasApplicableLaw
    - hasAuthority
    - hasHumanDescription
    - hasInverseJurisdiction
    - hasJurisdiction
    - hasJustification
    - hasLikelihood
    - hasObligation
