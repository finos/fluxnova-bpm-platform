    - preferredNamespaceUri
    - rdfs_Label
    - versionIRI
    - versionInfo
    - version
    - isProfileOf
    - logo
    slot_usage:
      version:
        range: string
    is_a: Concept
  DpvConceptScheme:
    title: Concept Scheme
    description: A list of terms DPV keeps within a vocabulary. DPV states nothing else about one.
    class_uri: skos:ConceptScheme
    slots:
    - id
    is_a: Concept
  DpvAgent:
    title: Agent
    description: A person or an organization DPV names as a contributor, as DPV's files describe them.
    class_uri: dcterms:Agent
    slots:
    - id
    - dpv_name
    - homepage
    - dpv_memberOf
    attributes:
      hasORCID:
        title: ORCID
        description: The person's ORCID identifier.
        slot_uri: scoro:hasORCID
    slot_usage:
      id: {}
    is_a: Concept
  DpvWebPage:
    title: Web Page
    description: A web page DPV names as a term's source.
    class_uri: sdo:WebPage
    slots:
    - dpv_url
    attributes:
      page_name:
        title: Page Name
        description: The page's title.
        slot_uri: sdo:name
        required: true
  DpvInterval:
    title: Interval
    description: A period of time, with the dates that start and end it.
    class_uri: time:ProperInterval
    attributes:
      hasBeginning:
        title: Has Beginning
        description: The date the period starts.
        slot_uri: time:hasBeginning
        range: dpv_date
      hasEnd:
        title: Has End
        description: The date the period ends.
        slot_uri: time:hasEnd
        range: dpv_date
  DpvTerm:
    title: Term
    abstract: true
    description: One thing DPV's vocabularies state, or a thing a use case describes with them, as a record
      under its own IRI.
    slots:
    - id
    - type
    - prefLabel
    - prefLabel_de
    - dpv_definition
    - definition_de
    - scopeNote
    - broader
    - related
    - inScheme
