id: https://w3id.org/lmodel/dpv-lokf
name: dpv
title: Data Privacy Vocabulary (DPV)
description: 'A LinkML model of the Data Privacy Vocabulary (DPV) 2.3 of the W3C Data Privacy Vocabularies
  and Controls Community Group. DPV states each concept as a class and as an instance of a broader concept,
  so the model holds its terms as records: each concept that terms are instances of is a class, each property
  is a slot under its own IRI, and every term of DPV''s vocabularies is a record that validates against
  them.'
version: '2.3'
source: https://w3id.org/dpv/2.3
license: Apache-2.0
keywords:
- privacy
- data protection
- personal data
- DPV
- GDPR
- vocabulary
see_also:
- https://lmodel.github.io/dpv
- https://w3id.org/dpv
