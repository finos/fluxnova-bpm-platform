classes:
  DpvVocabulary:
    title: Vocabulary
    description: One of DPV's vocabularies, as its own Turtle file's header describes it.
    class_uri: owl:Ontology
    slots:
    - id
    - dpv_title
    - dpv_description
    - identifier
    - bibliographicCitation
    - conformsTo
    - dpv_created
