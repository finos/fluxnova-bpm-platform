    - iso_alpha3
    - iso_numeric
    - un_m49
  DpvProperty:
    title: Property
    is_a: DpvTerm
    class_uri: rdf:Property
    description: A property DPV states, with the classes it names as its usual subjects and values. Every
      property is also a slot of DpvResource.
    slots:
    - subPropertyOf
    - domainIncludes
    - rangeIncludes
  DpvResource:
    title: Resource
    is_a: DpvTerm
    class_uri: rdfs:Resource
    description: A thing a use case describes with DPV, such as a process, holding any DPV property, because
      DPV states none as limited to a class.
    comments:
    - DPV's domainIncludes and rangeIncludes say what a property usually joins, not what it must, so a
      validator cannot refuse a value on them. tests/dpv_rules.py reports a value that names nothing,
