    annotations:
      xsd_type: responseType
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_when:
        description: When the response fires, written as an expression; it always fires when none is given.
        range: string
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: when
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The response's name.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: name
      fixr_sync:
        description: How the response's timing relates to the request it answers.
        range: OrchestraSynchronization
        annotations:
          xml_attribute: sync
  OrchestraResponsesV10:
    title: Orchestra responses (1.0)
    description: The responses a message can cause, tried one after another as given.
    annotations:
      xsd_type: messageType/responses
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_response:
        description: The responses, in order.
        range: OrchestraResponseV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_element: response
  OrchestraSectionV10:
    title: Orchestra section (1.0)
    description: A broad business area, such as pre-trade or post-trade, that categories fall under.
    mixins:
    - OrchestraPedigreeV10Mixin
    annotations:
      xsd_type: sectionType
