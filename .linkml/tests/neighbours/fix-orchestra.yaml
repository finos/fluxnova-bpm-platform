  OrchestraXmlElement:
    title: Open XML element
    description: An XML element in a place where the XSDs accept any content, kept as written so that
      the file converts back unchanged.
    attributes:
      xml_name:
        description: The name, with its namespace in braces when it has one.
        required: true
        pattern: ^(\{[^}]*\})?[^\s{}]+$
      xml_attributes:
        description: The element's attributes.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
      xml_text:
        description: The text before the first child element.
      xml_children:
        description: The child elements, in order.
        range: OrchestraXmlElement
        multivalued: true
        inlined_as_list: true
      xml_tail:
        description: The text after the element and before its next sibling.
  OrchestraXmlAttribute:
    title: Open XML attribute
    description: An XML attribute from another namespace, kept as written.
    attributes:
      xml_name:
        description: The name, with its namespace in braces when it has one.
        required: true
        pattern: ^(\{[^}]*\})?[^\s{}]+$
      xml_value:
        description: The attribute's value.
        required: true
  OrchestraActionParameterV10:
    title: Orchestra action input (1.0)
    description: One input to an action, which is a field, component or group, defined in place or named
      by reference. It holds exactly one of these.
    annotations:
      xsd_type: choice of field, fieldRef, component, componentRef, group, groupRef
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    exactly_one_of:
    - slot_conditions:
        fixr_field:
          required: true
    - slot_conditions:
        fixr_field_ref:
          required: true
    - slot_conditions:
        fixr_component:
          required: true
    - slot_conditions:
        fixr_component_ref:
          required: true
    - slot_conditions:
        fixr_group:
          required: true
    - slot_conditions:
        fixr_group_ref:
          required: true
    attributes:
      fixr_field:
        description: A field defined in place.
        range: OrchestraFieldV10
        inlined: true
        annotations:
          xml_element: field
      fixr_field_ref:
        description: A field used by reference.
        range: OrchestraFieldRefV10
        inlined: true
        annotations:
          xml_element: fieldRef
      fixr_component:
        description: A component defined in place.
        range: OrchestraComponentV10
        inlined: true
        annotations:
          xml_element: component
      fixr_component_ref:
        description: A component used by reference.
        range: OrchestraComponentRefV10
        inlined: true
        annotations:
          xml_element: componentRef
      fixr_group:
        description: A repeating group defined in place.
        range: OrchestraGroupV10
        inlined: true
        annotations:
          xml_element: group
      fixr_group_ref:
        description: A group used by reference.
        range: OrchestraGroupRefV10
        inlined: true
        annotations:
          xml_element: groupRef
  OrchestraActionStepV10:
    title: Orchestra action step (1.0)
    description: 'One thing an action does: send a message, set a value, fire a transition or schedule
      a timer. It holds exactly one of these.'
    annotations:
      xsd_type: choice of messageRef, assign, trigger, timerSchedule
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    exactly_one_of:
    - slot_conditions:
        fixr_message_ref:
          required: true
    - slot_conditions:
        fixr_assign:
          required: true
    - slot_conditions:
        fixr_trigger:
          required: true
    - slot_conditions:
        fixr_timer_schedule:
          required: true
    attributes:
      fixr_message_ref:
        description: A message to send.
        range: OrchestraMessageRefV10
        inlined: true
        annotations:
          xml_element: messageRef
      fixr_assign:
        description: An expression that gives an actor's variable a value, such as $actor.variable=value.
        range: string
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: assign
      fixr_trigger:
        description: A transition to fire.
        range: OrchestraTriggerV10
        inlined: true
        annotations:
          xml_element: trigger
      fixr_timer_schedule:
        description: A timer to start, stop or restart.
        range: OrchestraTimerScheduleV10
        inlined: true
        annotations:
          xml_element: timerSchedule
  OrchestraActionV10:
    title: Orchestra action (1.0)
    description: 'Things that happen together, such as when a response fires or a state is entered: messages
