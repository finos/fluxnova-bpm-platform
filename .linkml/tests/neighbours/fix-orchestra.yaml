        inlined: true
        annotations:
          xml_element: encodingStandards
      fixr_datatypes:
        description: The repository's datatypes.
        range: OrchestraDatatypesV11
        inlined: true
        annotations:
          xml_element: datatypes
      fixr_code_sets:
        description: The repository's code sets.
        range: OrchestraCodeSetsV11
        inlined: true
