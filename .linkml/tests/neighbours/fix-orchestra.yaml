      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The section's name.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: name
      fixr_display_order:
        description: Where the section comes when all sections are shown.
        range: integer
        minimum_value: -2147483648
        maximum_value: 2147483647
        annotations:
          xml_attribute: displayOrder
      fixr_fixml_file_name:
        description: The FIXML schema file that holds the elements of this section or category.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: FIXMLFileName
    is_a: Concept
  OrchestraSectionsV10:
    title: Orchestra sections (1.0)
    description: The sections a repository defines.
    mixins:
    - OrchestraContainerV10Mixin
    annotations:
      xsd_type: sections
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_section:
        description: The sections.
        range: OrchestraSectionV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
