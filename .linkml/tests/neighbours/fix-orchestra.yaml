        required: true
        annotations:
          xml_attribute: operation
      fixr_interval:
        description: How long the timer runs, as an XML Schema duration.
        range: string
        pattern: ^-?P(?=\d|T\d)(\d+Y)?(\d+M)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$
        annotations:
          xml_attribute: interval
  OrchestraTimerV11:
    title: Orchestra timer (1.1-rc3)
    description: A named timer that an actor owns.
    annotations:
      xsd_type: timerType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_name:
        description: The timer's name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
  OrchestraTransitionV11:
    title: Orchestra transition (1.1-rc3)
    description: A move from one state to a named target state, with the condition that allows it.
    annotations:
      xsd_type: transitionType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_when:
        description: The condition that allows the transition, written as an expression; the transition
          is always allowed when none is given.
        range: string
        pattern: ^[\s\S]{0,1024}$
        annotations:
          xml_element: when
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The transition's name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
      fixr_target:
        description: The state the transition leads to, by name.
        range: string
        required: true
        annotations:
          xml_attribute: target
  OrchestraTransportV11:
    title: Orchestra transport (1.1-rc3)
    description: The transport-level protocol of an interface or session, with its address, how messages
      are cast and its use.
    is_a: OrchestraProtocolV11
    annotations:
      xsd_type: transportProtocolType
      xml_namespace: http://fixprotocol.io/2026/orchestra/interfaces
    in_subset:
    - fixi
    attributes:
      fixi_address:
        description: The address to connect to, such as a host and port.
        range: string
        pattern: ^([^ \t\r\n]+( [^ \t\r\n]+)*)?$
        annotations:
          xml_attribute: address
      fixi_message_cast:
        description: Whether messages go to one, some or every receiver; unicast when none is given.
        range: OrchestraMessageCast
        ifabsent: OrchestraMessageCast(unicast)
        annotations:
          xml_attribute: messageCast
      fixi_use:
        description: The transport's role, such as primary or alternate.
        any_of:
        - range: OrchestraTransportUse
        - range: string
        annotations:
          xml_attribute: use
      fixi_other_attributes:
        description: Attributes from other namespaces, kept as written.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: attributes
  OrchestraTriggerV11:
    title: Orchestra trigger (1.1-rc3)
    description: A step that fires a named transition of an actor's state machine.
    annotations:
      xsd_type: triggerType
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_state_machine:
        description: The state machine whose transition fires, by name.
        range: string
        required: true
        annotations:
          xml_attribute: stateMachine
      fixr_actor:
        description: The actor whose timer or state machine this is, by name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: actor
      fixr_name:
        description: The transition to fire, by name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,64}$)([^ \t\r\n]+( [^ \t\r\n]+)*)$
        annotations:
          xml_attribute: name
  OrchestraUniqueV11:
    title: Orchestra uniqueness check (1.1-rc3)
    description: A check that a field's value is unique among the values that share the other fields it
      names, or among all values when it names none.
    annotations:
      xsd_type: fieldRuleType/unique
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_field_ref:
        description: The fields that scope the check, in order.
        range: OrchestraFieldRefV11
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_element: fieldRef
  OrchestraUnnamedEncodingV11:
    title: Orchestra encoding block in place (1.1-rc3)
    description: An encoding block whose standard is clear from where it sits, so it names none.
    is_a: OrchestraBaseEncodingV11
    annotations:
      xsd_type: unnamedEncoding
      xml_namespace: http://fixprotocol.io/2026/orchestra/repository
    in_subset:
    - fixr
  OrchestraUserInterfaceV11:
    title: Orchestra user interface (1.1-rc3)
    description: A user interface an interface offers, such as a trading screen, described as a protocol.
    is_a: OrchestraProtocolV11
    annotations:
      xsd_type: userInterfaceType
      xml_namespace: http://fixprotocol.io/2026/orchestra/interfaces
    in_subset:
    - fixi
enums:
  OrchestraChangeKind:
    title: Orchestra change kind
    description: How far an element's latest change reaches.
    permissible_values:
      Editorial:
        description: A change to wording only.
      Definitional:
        description: A change to what the element means.
  OrchestraLayer:
    title: Orchestra protocol layer
    description: The layer of the communication stack a protocol works on.
    permissible_values:
      application:
        description: The application layer.
      presentation:
        description: The presentation layer, where encodings sit.
      session:
        description: The session layer.
      transport:
        description: The transport layer.
  OrchestraMemberSelection:
    title: Orchestra member selection
    description: How many of a block's members must appear.
    permissible_values:
      oneOf:
        description: Exactly one member appears.
      anyOf:
        description: One or more members appear.
  OrchestraMessageCast:
    title: Orchestra message casting
    description: How many receivers a transport sends each message to.
    permissible_values:
      unicast:
        description: One receiver.
      multicast:
        description: A group of receivers.
      broadcast:
        description: Every receiver.
  OrchestraPresence:
    title: Orchestra presence
    description: Whether an item must, may or must not appear in a message.
    permissible_values:
      optional:
        description: May appear; a rule can make it required.
      required:
        description: Must appear.
      forbidden:
        description: Must not appear.
      ignored:
        description: May appear, and is not checked.
      constant:
        description: Has a fixed value, which some encodings leave off the wire.
  OrchestraProtocolName:
    title: Orchestra protocol name
    description: The FIX protocols the interfaces file names, so that they are spelled one way. A file
      may name another protocol.
    permissible_values:
      FIX4:
        description: The FIX 4 session layer.
      FIXT:
        description: FIXT 1.1, the session protocol of FIX 5.
      FIXP:
        description: FIXP, the FIX session protocol built for high performance.
      tagvalue:
        description: Classic tag=value encoding.
      FIXML:
        description: FIX in XML.
      FAST:
        description: The FAST streaming encoding.
      SBE:
        description: Simple Binary Encoding.
      SOFH:
        description: The SOFH message framing header.
      GPB:
        description: Google's protocol buffers.
      JSON:
        description: JSON encoding.
      FIXS:
        description: FIX over TLS.
  OrchestraPurpose:
    title: Orchestra text purpose
    description: The kinds of purpose the standard names for a text or hint. A file may give another purpose
      of its own.
    permissible_values:
      SYNOPSIS:
        description: A short summary.
      ELABORATION:
        description: A longer explanation.
      EXAMPLE:
        description: An example of use.
      DISPLAY:
        description: A name to show to people in place of the element's own.
  OrchestraReliability:
    title: Orchestra delivery guarantee
    description: What a flow or protocol promises about delivering each message.
    permissible_values:
      bestEffort:
        description: No promise; any message can be lost.
      idempotent:
        description: Each message is acted on at most once; a lost one is not sent again.
      recoverable:
        description: Each message is acted on exactly once; a lost one can be sent again.
  OrchestraRole:
    title: Orchestra session role
    description: A party's role in setting up a session.
    permissible_values:
      initiator:
        description: The party that opens a FIX session.
      acceptor:
        description: The party that answers a request to open a FIX session.
      client:
        description: The party that connects to a server.
      server:
        description: The party that waits for clients to connect.
  OrchestraSupport:
    title: Orchestra support level
    description: How a party treats an element of the standard.
    permissible_values:
      supported:
        description: The party supports the element.
      forbidden:
        description: The party refuses the element.
      ignored:
        description: The party accepts the element and acts on none of it.
  OrchestraSynchronization:
    title: Orchestra response timing
    description: How the timing of a response relates to the request it answers.
    permissible_values:
      asynchronous:
        description: The response's timing has no tie to the request's.
      synchronous:
        description: A request waits until the one before it has its answer.
      pipelined:
        description: Each response follows its request, and several requests may wait for answers at once.
  OrchestraTimerOperation:
    title: Orchestra timer operation
    description: What a step does to an actor's timer.
    permissible_values:
      START:
        description: Start the timer.
      CANCEL:
        description: Stop the timer.
      RESET:
        description: Stop the timer and start it again.
  OrchestraTransportUse:
    title: Orchestra transport use
    description: The roles the interfaces file names for a transport. A file may give another role of
      its own.
    permissible_values:
      primary:
        description: The main connection.
      secondary:
        description: The backup connection.
      alternate:
        description: Another connection, used in turn or by choice.
  OrchestraCategoryContentV10:
    title: Orchestra category content (1.0)
    description: What a category sorts, in v1.0.
    permissible_values:
      Field:
        description: The category sorts fields.
      Message:
        description: The category sorts messages.
  OrchestraCategoryIncludeFileV10:
    title: Orchestra category include file (1.0)
    description: The shared FIXML file a category's own file includes, in v1.0.
    permissible_values:
      components:
        description: The shared file of components.
      fields:
        description: The shared file of fields.
  OrchestraDatatypeStandardV10:
    title: Orchestra datatype standard (1.0)
    description: The standards v1.0 names for mapping a datatype. A file may give another standard of
      its own.
    permissible_values:
      ISO11404:
        description: The general-purpose datatypes of ISO/IEC 11404.
      GPB:
        description: Google's protocol buffers.
      JSON:
        description: JSON Schema.
      SBE:
        description: Simple Binary Encoding.
      XML:
        description: XML Schema, as FIXML uses it.
      TAG_VALUE:
        description: The classic tag=value encoding.
  OrchestraUnionDatatypeV10:
    title: Orchestra union datatype (1.0)
    description: The datatypes v1.0 names whose values a field may hold beside its codes.
    permissible_values:
      Qty:
        description: Quantities.
      Reserved100Plus:
        description: Values from 100 up, kept for user-defined codes.
      Reserved1000Plus:
        description: Values from 1000 up, kept for user-defined codes.
      Reserved4000Plus:
        description: Values from 4000 up, kept for user-defined codes.
      Tenor:
        description: Tenors, such as 3M.
  OrchestraPurposeV11:
    title: Orchestra text purpose (1.1-rc3)
    description: The kinds of purpose the standard names for a text or hint. A file may give another purpose
      of its own.
    permissible_values:
      SYNOPSIS:
        description: A short summary.
      ELABORATION:
        description: A longer explanation.
      EXAMPLE:
        description: An example of use.
      DISPLAY:
        description: A name to show to people in place of the element's own.
      CAPTION:
        description: A label for a table, a figure or a heading.
      TOOLTIP:
        description: A short hint shown when a pointer rests on the element.
      DEFINITION:
        description: A formal definition in one sentence.
subsets:
  fixr:
    description: Elements that a repository holds.
  fixi:
    description: Elements that an interfaces file holds.
