        multivalued: true
        inlined_as_list: true
        annotations:
          xml_choice: field fieldRef component componentRef group groupRef
      fixr_actions:
        description: 'What the action does, in order: messages sent, values set, transitions fired and
          timers scheduled.'
        range: OrchestraActionStepV10
        required: true
        multivalued: true
        inlined_as_list: true
