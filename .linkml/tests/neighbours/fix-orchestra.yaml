        range: string
        annotations:
          xml_text: 'true'
      fixi_name:
        description: What kind of identifier this is, such as SenderCompID.
        range: string
        annotations:
          xml_attribute: name
  OrchestraSessionProtocolV10:
    title: Orchestra session protocol (1.0)
    description: The session-level protocol of an interface or session, such as FIXT or FIXP.
    is_a: OrchestraProtocolV10
    annotations:
      xsd_type: sessionProtocolType
      xml_namespace: http://fixprotocol.io/2020/orchestra/interfaces
    in_subset:
    - fixi
  OrchestraSessionV10:
    title: Orchestra session (1.0)
    description: One connection between two parties, with the identifiers, role, activation times and
