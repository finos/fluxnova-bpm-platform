          xml_element: initial
      fixr_state:
        description: The machine's other states.
        range: OrchestraStateV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_element: state
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The state machine's name.
        range: string
