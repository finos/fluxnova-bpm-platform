  OrchestraSessionIdentifierV10:
    title: Orchestra session identifier (1.0)
    description: A value, with what kind it is, that picks out a session, such as a sender or target ID.
    annotations:
      xsd_type: identifierType
      xml_namespace: http://fixprotocol.io/2020/orchestra/interfaces
    in_subset:
