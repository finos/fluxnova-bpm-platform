    title: Orchestra datatype mapping (1.0)
    description: How a FIX datatype is written in another standard, such as XML Schema or protocol buffers.
    annotations:
      xsd_type: mappedDatatype
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_extension:
        description: XML from the target standard's own schema.
        range: OrchestraDatatypeExtensionV10
        inlined: true
        annotations:
          xml_element: extension
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_standard:
        description: The standard the datatype is written in, such as XML or GPB.
        any_of:
        - range: OrchestraDatatypeStandardV10
        - range: string
        required: true
        annotations:
          xml_attribute: standard
      fixr_builtin:
        description: Whether the target standard has the type built in, rather than derived.
        range: boolean
        annotations:
          xml_attribute: builtin
      fixr_base:
        description: The type in the target standard that the mapping narrows or builds on.
        range: string
        annotations:
          xml_attribute: base
      fixr_pattern:
        description: A pattern the value matches in the target standard.
        range: string
        annotations:
          xml_attribute: pattern
      fixr_element:
        description: The type of each item when the target type is a list or array.
        range: string
        annotations:
          xml_attribute: element
      fixr_parameter:
        description: A setting of the target type, such as its precision.
        range: string
        annotations:
          xml_attribute: parameter
      fixr_min_inclusive:
        description: The smallest value allowed.
        range: string
        annotations:
          xml_attribute: minInclusive
      fixr_max_inclusive:
        description: The largest value allowed.
        range: string
        annotations:
          xml_attribute: maxInclusive
  OrchestraMessageRefV10:
    title: Orchestra message sent (1.0)
    description: A message an action sends, by its number and type code, with the fields it sets or carries
      over.
    mixins:
    - OrchestraReferenceV10Mixin
    annotations:
      xsd_type: messageRefType
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_identifiers:
        description: The fields the message sets or carries over.
        range: OrchestraIdentifiersV10
        inlined: true
        annotations:
          xml_element: identifiers
      fixr_name:
        description: The message sent, by name.
        range: string
        required: true
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: name
      fixr_msg_type:
        description: The MsgType(35) code of the message sent.
        range: string
        pattern: ^[\s\S]{1,2}$
        annotations:
          xml_attribute: msgType
      fixr_impl_min_occurs:
        description: The fewest times the message is sent; once when none is given.
        range: integer
        minimum_value: 1
        ifabsent: int(1)
        annotations:
          xml_attribute: implMinOccurs
      fixr_impl_max_occurs:
        description: The most times the message is sent, or unbounded.
        range: string
        pattern: ^(\d+|unbounded)$
        ifabsent: string(unbounded)
        annotations:
          xml_attribute: implMaxOccurs
  OrchestraMessageStructureV10:
    title: Orchestra message layout (1.0)
    description: The ordered fields, groups and components of a message.
    annotations:
      xsd_type: messageType/structure
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_members:
        description: The message's fields, groups and components, in order.
        range: OrchestraStructureMemberV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_choice: componentRef groupRef fieldRef
      fixr_which:
        description: Whether one member exactly, or one or more members, must appear.
        range: OrchestraMemberSelection
        annotations:
          xml_attribute: which
  OrchestraMessageV10:
    title: Orchestra message (1.0)
    description: 'A FIX message: its type code, the fields, groups and components it carries in order,
      and the responses it can cause.'
    mixins:
    - OrchestraIdentityV10Mixin
    - OrchestraPedigreeV10Mixin
    annotations:
      xsd_type: messageType
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_structure:
        description: The message's fields, groups and components, in order.
        range: OrchestraMessageStructureV10
        required: true
        inlined: true
        annotations:
          xml_element: structure
      fixr_responses:
        description: What can happen when the message arrives.
        range: OrchestraResponsesV10
        inlined: true
        annotations:
          xml_element: responses
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_msg_type:
        description: The message's MsgType(35) code.
        range: string
        pattern: ^[\s\S]{1,2}$
        annotations:
          xml_attribute: msgType
      fixr_category:
        description: The category the message belongs to, by name.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: category
      fixr_flow:
        description: The flow that carries the message, by name.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_)*)$
        annotations:
          xml_attribute: flow
    is_a: Concept
  OrchestraMessagesV10:
    title: Orchestra messages (1.0)
    description: The messages a repository defines.
    mixins:
    - OrchestraContainerV10Mixin
    annotations:
      xsd_type: messages
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_message:
        description: The messages.
        range: OrchestraMessageV10
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        annotations:
          xml_element: message
      xml_base:
        description: The base address for the list's relative links, which XInclude uses.
        range: uri
        annotations:
          xml_attribute: xml:base
  OrchestraPedigreeV10Mixin:
    title: Orchestra pedigree (1.0)
    description: When an element was added, changed, deprecated or replaced, by FIX version and extension
      pack, and whether it is supported.
    mixin: true
    annotations:
      xsd_type: entityAttribGrp
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_added:
        description: The FIX version in which the element first appeared.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: added
      fixr_added_ep:
        description: The extension pack in which the element first appeared.
        range: integer
        annotations:
          xml_attribute: addedEP
      fixr_change_type:
        description: Whether the latest change was to wording only or to meaning.
        range: OrchestraChangeKind
        annotations:
          xml_attribute: changeType
      fixr_deprecated:
        description: The FIX version from which the element is deprecated.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: deprecated
      fixr_deprecated_ep:
        description: The extension pack from which the element is deprecated.
        range: integer
        annotations:
          xml_attribute: deprecatedEP
      fixr_issue:
        description: The change request behind the element's latest change.
        range: string
        annotations:
          xml_attribute: issue
      fixr_last_modified:
        description: The FIX version in which the element last changed.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: lastModified
      fixr_replaced:
        description: The FIX version in which another element took this one's place.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: replaced
      fixr_replaced_ep:
        description: The extension pack in which another element took this one's place.
        range: integer
        annotations:
          xml_attribute: replacedEP
      fixr_replaced_by_field:
        description: The tag number of the field that takes this element's place.
        range: integer
        minimum_value: 1
        annotations:
          xml_attribute: replacedByField
      fixr_supported:
        description: Whether a party supports, refuses or ignores the element; supported when none is
          given.
        range: OrchestraSupport
        ifabsent: OrchestraSupport(supported)
        annotations:
          xml_attribute: supported
      fixr_updated:
        description: The FIX version of the element's latest update.
        range: string
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: updated
      fixr_updated_ep:
        description: The extension pack of the element's latest update.
        range: integer
        annotations:
          xml_attribute: updatedEP
  OrchestraProtocolV10:
    title: Orchestra protocol (1.0)
    description: A protocol used on one layer of an interface or session, with its version, layer and
      delivery guarantee.
    annotations:
      xsd_type: protocolType
      xml_namespace: http://fixprotocol.io/2020/orchestra/interfaces
    in_subset:
    - fixi
    attributes:
      fixi_annotation:
        description: Notes for readers and hints for software.
        range: OrchestraInterfaceAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixi_name:
        description: The protocol's name, such as FIXT or SBE, or another name of the provider's choice.
        any_of:
        - range: OrchestraProtocolName
        - range: string
        annotations:
          xml_attribute: name
      fixi_version:
        description: The protocol's version.
        range: string
        annotations:
          xml_attribute: version
      fixi_layer:
        description: The layer the protocol works on.
        range: OrchestraLayer
        annotations:
          xml_attribute: layer
      fixi_reliability:
        description: The delivery guarantee the protocol gives, which a transport, a session or the application
          may provide.
        range: OrchestraReliability
        annotations:
          xml_attribute: reliability
      fixi_orchestration:
        description: Where to find the Orchestra repository that sets out the protocol's messages and
          rules.
        range: uri
        annotations:
          xml_attribute: orchestration
      fixi_other_attributes:
        description: Attributes from other namespaces, kept as written.
        range: OrchestraXmlAttribute
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_any: attributes
    is_a: Concept
  OrchestraReferenceV10Mixin:
    title: Orchestra reference keys (1.0)
    description: 'The keys by which a use points at a defined element: its number, its scenario and, as
      a convenience, its name.'
    mixin: true
    annotations:
      xsd_type: refidGrp
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_id:
        description: The number of the element in use; for a field, its tag number.
        range: integer
        required: true
        minimum_value: 1
        annotations:
          xml_attribute: id
      fixr_scenario:
        description: The scenario of the element in use; base when none is given.
        range: string
        pattern: ^(?=[\s\S]{1,255}$)(([A-Z]|[a-z])([0-9]|[A-Z]|[a-z]|_|-)*)$
        ifabsent: string(base)
        annotations:
          xml_attribute: scenario
  OrchestraRepositoryV10:
    title: Orchestra repository (1.0)
    description: 'A machine-readable set of rules of engagement: the datatypes, code sets, fields, components,
      groups and messages it defines, and the actors and workflows that use them.'
    mixins:
    - OrchestraContainerV10Mixin
    annotations:
      xsd_type: repository
      xml_namespace: http://fixprotocol.io/2020/orchestra/repository
    in_subset:
    - fixr
    attributes:
      fixr_metadata:
        description: The file's Dublin Core description, such as its title, publisher and date.
        range: OrchestraMetadata
        required: true
        inlined: true
        annotations:
          xml_element: metadata
      fixr_categories:
        description: The repository's categories.
        range: OrchestraCategoriesV10
        inlined: true
        annotations:
          xml_element: categories
      fixr_sections:
        description: The repository's sections.
        range: OrchestraSectionsV10
        inlined: true
        annotations:
          xml_element: sections
      fixr_datatypes:
        description: The repository's datatypes.
        range: OrchestraDatatypesV10
        required: true
        inlined: true
        annotations:
          xml_element: datatypes
      fixr_code_sets:
        description: The repository's code sets.
        range: OrchestraCodeSetsV10
        required: true
        inlined: true
        annotations:
          xml_element: codeSets
      fixr_fields:
        description: The repository's fields.
        range: OrchestraFieldsV10
        required: true
        inlined: true
        annotations:
          xml_element: fields
      fixr_actors:
        description: The repository's actors and flows.
        range: OrchestraActorsV10
        inlined: true
        annotations:
          xml_element: actors
      fixr_components:
        description: The repository's components.
        range: OrchestraComponentsV10
        inlined: true
        annotations:
          xml_element: components
      fixr_groups:
        description: The repository's repeating groups.
        range: OrchestraGroupsV10
        inlined: true
        annotations:
          xml_element: groups
      fixr_messages:
        description: The repository's messages.
        range: OrchestraMessagesV10
        required: true
        inlined: true
        annotations:
          xml_element: messages
      fixr_concepts:
        description: The repository's concepts.
        range: OrchestraConceptsV10
        inlined: true
        annotations:
          xml_element: concepts
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV10
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The repository's name, which stays the same across its minor versions.
        range: string
        required: true
        annotations:
          xml_attribute: name
      fixr_version:
        description: The repository's version, such as FIX.Latest_EP312.
        range: string
        required: true
        pattern: ^((FIX.2.7)|(FIX.3.0)|(FIX\.4\.[0-4])|((FIX.Latest|(FIX\.5\.0(SP\d{1,2})?))(_EP((9[8-9])|([1-9][0-9][0-9])))?)|(FIXT.1.1)|([0-9]+)\.([0-9]+)|(\d{8}))$
        annotations:
          xml_attribute: version
      fixr_guid:
        description: An identifier of the repository, unique worldwide.
        range: string
        annotations:
          xml_attribute: guid
      fixr_spec_url:
        description: The address of a document that describes the element.
        range: uri
        annotations:
          xml_attribute: specUrl
      fixr_namespace:
        description: A namespace address that goes with the repository.
        range: uri
        annotations:
          xml_attribute: namespace
      fixr_appl_ver_id:
        description: The FIX version the repository describes, as its ApplVerID(1128) code.
        range: string
        annotations:
          xml_attribute: applVerId
      fixr_expression_language:
        description: The language the conditions and assignments are written in; Score when none is given.
        range: string
        ifabsent: string(Score)
        annotations:
          xml_attribute: expressionLanguage
    is_a: Concept
  OrchestraResponseV10:
    title: Orchestra response (1.0)
    description: 'What happens when a message arrives, under an optional condition: messages sent, values
