          xml_element: codeSets
      fixr_fields:
        description: The repository's fields.
        range: OrchestraFieldsV11
        inlined: true
        annotations:
          xml_element: fields
      fixr_actors:
        description: The repository's actors and flows.
        range: OrchestraActorsV11
        inlined: true
        annotations:
          xml_element: actors
      fixr_components:
        description: The repository's components.
        range: OrchestraComponentsV11
        inlined: true
        annotations:
          xml_element: components
      fixr_groups:
        description: The repository's repeating groups.
        range: OrchestraGroupsV11
        inlined: true
        annotations:
          xml_element: groups
      fixr_messages:
        description: The repository's messages.
        range: OrchestraMessagesV11
        inlined: true
        annotations:
          xml_element: messages
      fixr_concepts:
        description: The repository's concepts.
        range: OrchestraConceptsV11
        inlined: true
        annotations:
          xml_element: concepts
      fixr_scenarios:
        description: The repository's scenarios.
        range: OrchestraScenariosV11
        inlined: true
        annotations:
          xml_element: scenarios
      fixr_annotation:
        description: Notes for readers and hints for software about the element.
        range: OrchestraAnnotationV11
        inlined: true
        annotations:
          xml_element: annotation
      fixr_name:
        description: The repository's name, which stays the same across its minor versions.
        range: string
        required: true
        annotations:
          xml_attribute: name
      fixr_version:
        description: The repository's version, such as FIX.Latest_EP312.
        range: string
        required: true
        pattern: ^([^ \t\r\n]+( [^ \t\r\n]+)*)$
