# Generated by `lokf adapt` from calm.yaml (calm 1.3); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/calm-lokf
name: calm
title: FINOS CALM
description: A LinkML model of CALM 1.3, the Common Architecture Language Model of FINOS's Architecture
  as Code project. Each module renders one file of the CALM Meta Schema and keeps CALM's keys, so a CALM
  document validates here unchanged, and CALM's JSON Schema files can be generated from the model.
version: '1.3'
source: https://github.com/finos/calm-schema/tree/47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d/schema
license: Apache-2.0
keywords:
- architecture as code
- software architecture
- CALM
- FINOS
see_also:
- https://lmodel.github.io/calm
- https://calm.finos.org/
- https://github.com/finos/calm-schema
annotations:
  upstream_tag: v1.3
  upstream_commit: 47e2a41a0e1e5e9fe639b30ce2adae8c4abc5b6d
  upstream_release_date: '2026-10-24'
  upstream_license: Apache-2.0
comments:
- A slot whose name differs from CALM's key carries the key as its alias, such as unique_id for unique-id.
  scripts/calm_meta.py writes CALM's files with the aliases as keys, which plain gen-json-schema does
  only with --preserve-names.
- Six slots list CALM's key under aliases instead, so that only CALM's files carry it. Five are source_end,
  destination_end, target_architectures, unit_of_time and decorator_type, because LOKF defines source,
  target, unit and type with other meanings, and a composite's JSON-LD context gives each key one IRI.
  The sixth, decorator_schema, holds $schema, which gen-python would make an attribute's name.
- 'A reference to a node, relationship or moment is its unique-id, a string, as CALM gives it. No slot
  is an identifier: gen-python in linkml 1.12.1 names an identifier''s type from its alias, and the hyphen
  in unique-id makes that name invalid Python.'
- calm.json and calm-timeline.json declare CALM's vocabulary beside JSON Schema's own and hold no definition,
  so no module renders them; the build copies them from upstream/.
prefixes:
  calm: https://w3id.org/lmodel/calm/
  calm_meta: https://calm.finos.org/release/1.3/meta/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: calm
default_range: string
imports:
- linkml:types
- lokf
classes:
  CalmControls:
    description: The controls that apply to an architecture element, each under a key of letters, digits
      and hyphens.
    comments:
    - CALM states the key pattern with patternProperties, which LinkML cannot state, so any key is accepted
      here. CALM itself leaves a key outside the pattern unchecked.
    exact_mappings:
    - calm_meta:control.json#/defs/controls
    extra_slots:
      range_expression:
        range: CalmControl
  CalmControl:
    description: One control in a controls map, with the requirements that define it.
    extra_slots:
      allowed: true
    attributes:
      requirements:
        description: The requirements this control applies, each with its configuration.
        range: CalmControlDetail
        multivalued: true
        inlined_as_list: true
        required: true
    slots:
    - description
    slot_usage:
      description:
        required: true
        range: string
  CalmControlDetail:
    description: A control requirement this control applies, with its configuration given by address or
      inline, but not both.
    exact_mappings:
    - calm_meta:control.json#/defs/control-detail
    extra_slots:
      allowed: true
    exactly_one_of:
    - slot_conditions:
        config_url:
          value_presence: PRESENT
    - slot_conditions:
        config:
          value_presence: PRESENT
    attributes:
      requirement_url:
        alias: requirement-url
        description: The requirement schema that specifies how a control should be defined
        required: true
      config_url:
        alias: config-url
        description: The configuration of how the control requirement schema is met
      config:
        description: Inline configuration of how the control requirement schema is met
        range: CalmControlConfig
        inlined: true
  CalmControlConfig:
    description: A configuration object, free in shape, that meets a control requirement.
    extra_slots:
      allowed: true
  CalmInterfaceDefinition:
    description: A modular interface definition referencing an external schema
    exact_mappings:
    - calm_meta:interface.json#/defs/interface-definition
    attributes:
      unique_id:
        alias: unique-id
        description: Unique identifier for this interface instance
        required: true
      definition_url:
        alias: definition-url
        description: URI of the external schema this interface configuration conforms to
        required: true
      config:
        description: Inline configuration conforming to the external interface schema
        range: CalmInterfaceConfig
        inlined: true
        required: true
  CalmInterfaceConfig:
    description: A configuration object, free in shape, that an interface definition's schema checks.
    extra_slots:
      allowed: true
  CalmInterfaceType:
    description: An interface given by its own keys, such as a host and port, rather than by an external
      schema.
    exact_mappings:
    - calm_meta:interface.json#/defs/interface-type
    extra_slots:
      allowed: true
    attributes:
      unique_id:
        alias: unique-id
        description: The interface's identifier, unique within the architecture.
        required: true
  CalmNodeInterface:
    description: One end of a connection, naming a node and, optionally, which of its interfaces.
    exact_mappings:
    - calm_meta:interface.json#/defs/node-interface
    extra_slots:
      allowed: true
    attributes:
      node:
        description: The unique-id of the node at this end.
        required: true
      interfaces:
        description: The unique-ids of the node's interfaces this end uses.
        multivalued: true
  CalmNode:
    description: A component of the architecture, such as a system, service, database or actor, with its
      interfaces and controls.
    exact_mappings:
    - calm_meta:core.json#/defs/node
    extra_slots:
      allowed: true
    attributes:
      unique_id:
        alias: unique-id
        description: The node's identifier, unique within the architecture.
        required: true
      node_type:
        alias: node-type
        description: What kind of node this is, one of CALM's built-in types or any other name.
        required: true
        any_of:
        - range: CalmNodeTypeDefinition
        - range: string
      description:
        description: What the node is and does.
        slot_uri: schema:description
        required: true
      details:
        description: Where a more detailed architecture of this node is, and the pattern it must follow.
        range: CalmNodeDetails
        inlined: true
      interfaces:
        description: The interfaces the node exposes.
        multivalued: true
        inlined_as_list: true
        any_of:
        - range: CalmInterfaceDefinition
          inlined: true
        - range: CalmInterfaceType
          inlined: true
      controls:
        description: The controls that apply to this node.
        range: CalmControls
        inlined: true
      metadata:
        description: Free-form metadata about this node.
        range: CalmMetadata
    slots:
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
    is_a: Concept
  CalmNodeDetails:
    description: References from a node to a more detailed architecture and to the pattern it must follow.
    attributes:
      detailed_architecture:
        alias: detailed-architecture
        description: The address of an architecture document that describes this node in detail.
      required_pattern:
        alias: required-pattern
        description: The address of a pattern that the detailed architecture must follow.
  CalmRelationship:
    description: A link between nodes, of one of CALM's kinds, or a choice between options.
    exact_mappings:
    - calm_meta:core.json#/defs/relationship
    extra_slots:
      allowed: true
    attributes:
      unique_id:
        alias: unique-id
        description: The relationship's identifier, unique within the architecture.
        required: true
      relationship_type:
        alias: relationship-type
        description: The kind of the relationship and the nodes it links.
        range: CalmRelationshipType
        inlined: true
        required: true
      protocol:
        description: The protocol a connection uses.
        range: CalmProtocol
      metadata:
        description: Free-form metadata about this relationship.
        range: CalmMetadata
      controls:
        description: The controls that apply to this relationship.
        range: CalmControls
        inlined: true
    slots:
    - description
    slot_usage:
      description:
        range: string
    is_a: Concept
  CalmRelationshipType:
    description: 'The kind of a relationship, given by exactly one of its keys: interacts, connects, deployed-in,
      composed-of or options.'
    extra_slots:
      allowed: true
    exactly_one_of:
    - slot_conditions:
        deployed_in:
          value_presence: PRESENT
    - slot_conditions:
        composed_of:
          value_presence: PRESENT
    - slot_conditions:
        interacts:
          value_presence: PRESENT
    - slot_conditions:
        connects:
          value_presence: PRESENT
    - slot_conditions:
        options:
          value_presence: PRESENT
    attributes:
      interacts:
        description: An actor that interacts with nodes.
        range: CalmInteractsType
        inlined: true
      connects:
        description: A connection from one node's interfaces to another's.
        range: CalmConnectsType
        inlined: true
      deployed_in:
        alias: deployed-in
        description: Nodes deployed in a container node.
        range: CalmDeployedInType
        inlined: true
      composed_of:
        alias: composed-of
        description: Nodes that make up a container node.
        range: CalmComposedOfType
        inlined: true
      options:
        description: Decisions between options, each naming the nodes and relationships it would add.
        range: CalmDecision
        multivalued: true
        inlined_as_list: true
  CalmInteractsType:
    description: A relationship in which an actor interacts with nodes.
    exact_mappings:
    - calm_meta:core.json#/defs/interacts-type
    extra_slots:
      allowed: true
    attributes:
      actor:
        description: The unique-id of the node that acts.
        required: true
      nodes:
        description: The unique-ids of the nodes it interacts with.
        multivalued: true
        minimum_cardinality: 1
        required: true
  CalmConnectsType:
    description: A relationship in which one node connects to another through their interfaces.
    exact_mappings:
    - calm_meta:core.json#/defs/connects-type
    extra_slots:
      allowed: true
    attributes:
      source_end:
        aliases:
        - source
        description: The end that opens the connection.
        range: CalmNodeInterface
        inlined: true
        required: true
      destination_end:
        aliases:
        - destination
        description: The end the connection reaches.
        range: CalmNodeInterface
        inlined: true
        required: true
  CalmDeployedInType:
    description: A relationship in which nodes are deployed in a container node.
    exact_mappings:
    - calm_meta:core.json#/defs/deployed-in-type
    extra_slots:
      allowed: true
    attributes:
      container:
        description: The unique-id of the node the others are deployed in.
        required: true
      nodes:
        description: The unique-ids of the deployed nodes.
        multivalued: true
        minimum_cardinality: 1
        required: true
  CalmComposedOfType:
    description: A relationship in which nodes make up a container node.
    exact_mappings:
    - calm_meta:core.json#/defs/composed-of-type
    extra_slots:
      allowed: true
    attributes:
      container:
        description: The unique-id of the node the others make up.
        required: true
      nodes:
        description: The unique-ids of the nodes it is made of.
        multivalued: true
        minimum_cardinality: 1
        required: true
  CalmDecision:
    description: One option of a choice, naming the nodes, relationships and controls it would add.
    exact_mappings:
    - calm_meta:core.json#/defs/decision
    extra_slots:
      allowed: true
    attributes:
      nodes:
        description: The unique-ids of the nodes this option adds.
        multivalued: true
        required: true
      relationships:
        description: The unique-ids of the relationships this option adds.
        multivalued: true
        required: true
      controls:
        description: The keys of the controls this option adds.
        multivalued: true
    slots:
    - description
    slot_usage:
      description:
        required: true
        range: string
  CalmMetadata:
    description: Free-form metadata, as an object or a list of objects.
    comments:
    - LinkML cannot state "an object, or a list of objects", so the class takes any value, and the build
      writes it as a schema that accepts any value.
    class_uri: linkml:Any
    exact_mappings:
    - calm_meta:core.json#/defs/metadata
  CalmFlow:
    description: A business flow, as an ordered list of transitions across the architecture's relationships.
    exact_mappings:
    - calm_meta:flow.json#/defs/flow
    attributes:
      unique_id:
        alias: unique-id
        description: Unique identifier for the flow
        required: true
      description:
        description: Detailed description of the flow's purpose
        slot_uri: schema:description
        required: true
      requirement_url:
        alias: requirement-url
        description: Link to a detailed requirement document
      transitions:
        description: The steps of the flow, each across one relationship.
        range: CalmTransition
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        required: true
      controls:
        description: The controls that apply to this flow.
        range: CalmControls
        inlined: true
      metadata:
        description: Free-form metadata about this flow.
        range: CalmMetadata
    slots:
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
    is_a: Concept
  CalmTransition:
    description: One step of a flow, across one relationship of the architecture.
    exact_mappings:
    - calm_meta:flow.json#/defs/transition
    extra_slots:
      allowed: true
    attributes:
      relationship_unique_id:
        alias: relationship-unique-id
        description: Unique identifier for the relationship in the architecture
        required: true
      sequence_number:
        alias: sequence-number
        description: Indicates the sequence of the relationship in the flow
        range: integer
        required: true
      direction:
        description: Which way along the relationship the step goes.
        range: CalmTransitionDirection
        ifabsent: string(source-to-destination)
    slots:
    - description
    slot_usage:
      description:
        required: true
        range: string
  CalmTimeline:
    description: A timeline document, listing the moments of an architecture and naming the current one.
    exact_mappings:
    - calm_meta:timeline.json
    extra_slots:
      allowed: true
    attributes:
      current_moment:
        alias: current-moment
        description: The unique-id of the current architecture moment within the timeline.
      moments:
        description: A list of significant architecture states or points in time, each represented as
          a 'moment'.
        range: CalmNodeMoment
        multivalued: true
        inlined_as_list: true
        required: true
      metadata:
        description: Free-form metadata about this timeline.
        range: CalmMetadata
  CalmNodeMoment:
    is_a: CalmNode
    description: 'A moment of a timeline: a node of type moment, with no interfaces, whose details point
      to the architecture of that moment.'
    exact_mappings:
    - calm_meta:timeline.json#/defs/node-moment
    extra_slots:
      allowed: true
    comments:
    - The three conditions on inherited slots are class rules, not slot_usage, because gen-shacl refuses
      equals_string on a slot that also has any_of.
    all_of:
    - slot_conditions:
        node_type:
          equals_string: moment
    - slot_conditions:
        details:
          value_presence: PRESENT
    - slot_conditions:
        interfaces:
          value_presence: ABSENT
    attributes:
      valid_from:
        alias: valid-from
        description: The date when this architecture moment came into effect.
        range: date
      adrs:
        description: External links to ADRs (Architecture Decision Records) or similar documents that
          provide context or decisions related to why the architecture changed.
        multivalued: true
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
  CalmDecorator:
    description: Supplementary information about elements of one or more architectures, kept apart from
      the architectures themselves.
    exact_mappings:
    - calm_meta:decorators.json#/defs/decorator
    attributes:
      decorator_schema:
        aliases:
        - $schema
        description: URI of the schema that this decorator conforms to, for example a decorator standard
      unique_id:
        alias: unique-id
        description: Unique identifier for this decorator
        required: true
      decorator_type:
        aliases:
        - type
        description: Type of decorator - a free-form string identifying the decorator category
        required: true
      target_type:
        alias: target-type
        description: Optional array of the types of CALM document that this decorator can target. The
          only type is architecture, because applies-to holds the unique-ids of architecture elements.
        range: CalmDecoratorTargetType
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
      target_architectures:
        aliases:
        - target
        description: Array of file paths or URLs referencing the CALM architectures this decorator targets
        multivalued: true
        minimum_cardinality: 1
        required: true
      applies_to:
        alias: applies-to
        description: Array of unique-ids referencing nodes, relationships, flows, or other architecture
          elements
        multivalued: true
        minimum_cardinality: 1
        required: true
      data:
        description: Free-form JSON object containing the decorator's data
        range: CalmDecoratorData
        inlined: true
        required: true
  CalmDecoratorData:
    description: The decorator's data, an object free in shape.
    comments:
    - CALM requires at least one key, which LinkML cannot state, so an empty object is accepted here.
    extra_slots:
      allowed: true
  CalmEvidenceDocument:
    description: An evidence document, which holds one piece of evidence for a control.
    exact_mappings:
    - calm_meta:evidence.json
    extra_slots:
      allowed: true
    attributes:
      evidence:
        description: The evidence this document holds.
        range: CalmEvidence
        inlined: true
        required: true
  CalmEvidence:
    description: Evidence that a control's configuration is met, by the paths where it is kept.
    extra_slots:
      allowed: true
    attributes:
      unique_id:
        alias: unique-id
        description: CALM unique-id for future linking and uniquely defining this evidence
        required: true
      evidence_paths:
        alias: evidence-paths
        description: Paths to the evidence relating to a specific control
        multivalued: true
        required: true
      control_config_url:
        alias: control-config-url
        description: URI for the control configuration this evidence relates to
        required: true
  CalmControlRequirement:
    description: 'A control requirement: what a control must achieve, which a control detail''s requirement-url
      points to.'
    exact_mappings:
    - calm_meta:control-requirement.json
    extra_slots:
      allowed: true
    examples:
    - object:
        control-id: CR-001
        name: Access Control
        description: Ensure that access to sensitive information is restricted.
    attributes:
      control_id:
        alias: control-id
        description: The unique identifier of this control, which has the potential to be used for linking
          evidence
        required: true
      description:
        description: A more detailed description of the control and information on what a developer needs
          to consider
        slot_uri: schema:description
        required: true
    slots:
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        required: true
        range: string
    is_a: Concept
  CalmTimeUnit:
    description: A unit of time with a value and a unit type.
    exact_mappings:
    - calm_meta:units.json#/defs/time-unit
    examples:
    - object:
        unit: seconds
        value: 30
    - object:
        unit: minutes
        value: 15
    - object:
        unit: hours
        value: 1
    - object:
        unit: days
        value: 7
    attributes:
      unit_of_time:
        aliases:
        - unit
        description: The unit of time (e.g., seconds, minutes, hours).
        range: CalmTimeUnitName
        required: true
      value:
        description: The numeric value representing the amount of time.
        comments:
        - CALM gives the value as a JSON number. A decimal keeps it exact in RDF and Python, where a float
          would round it, and renders as number too.
        range: decimal
        minimum_value: 0
        required: true
  CalmRateUnit:
    description: A unit representing a rate (e.g., operations per second).
    exact_mappings:
    - calm_meta:units.json#/defs/rate-unit
    examples:
    - object:
        rate: 30
        per: second
    - object:
        rate: 1000
        per: minute
    - object:
        rate: 5
        per: millisecond
    attributes:
      rate:
        description: The numeric value representing the rate.
        comments:
        - CALM gives the rate as a JSON number. A decimal keeps it exact in RDF and Python, where a float
          would round it, and renders as number too.
        range: decimal
        minimum_value: 0
        required: true
      per:
        description: The time unit defining the rate interval.
        range: CalmRateInterval
        required: true
  CalmArchitecture:
    description: 'A CALM architecture document: the nodes of a system, the relationships between them,
      its business flows, and the controls that apply to it.'
    comments:
    - An architecture is itself a JSON Schema document, so it may carry JSON Schema's keys, such as $schema,
      beside CALM's own.
    exact_mappings:
    - calm_meta:core.json
    extra_slots:
      allowed: true
    attributes:
      nodes:
        description: The components of the architecture.
        range: CalmNode
        multivalued: true
        inlined_as_list: true
      relationships:
        description: The links between the architecture's nodes.
        range: CalmRelationship
        multivalued: true
        inlined_as_list: true
      metadata:
        description: Free-form metadata about the architecture.
        range: CalmMetadata
      controls:
        description: The controls that apply to the whole architecture.
        range: CalmControls
        inlined: true
      flows:
        description: The business flows that run across the architecture.
        range: CalmFlow
        multivalued: true
        inlined_as_list: true
      adrs:
        description: External links to ADRs (Architecture Decision Records) or similar documents that
          provide context or decisions related to the architecture. These can be URLs or references to
          internal documentation.
        multivalued: true
enums:
  CalmProtocol:
    description: The protocol a relationship uses.
    exact_mappings:
    - calm_meta:core.json#/defs/protocol
    permissible_values:
      HTTP:
        description: Hypertext Transfer Protocol.
      HTTPS:
        description: HTTP over TLS.
      FTP:
        description: File Transfer Protocol.
      SFTP:
        description: SSH File Transfer Protocol.
      JDBC:
        description: Java Database Connectivity.
      WebSocket:
        description: The WebSocket protocol.
      SocketIO:
        description: The Socket.IO protocol.
      LDAP:
        description: Lightweight Directory Access Protocol.
      AMQP:
        description: Advanced Message Queuing Protocol.
      TLS:
        description: Transport Layer Security.
      mTLS:
        description: TLS in which both ends present a certificate.
      TCP:
        description: Transmission Control Protocol.
  CalmNodeTypeDefinition:
    description: CALM's built-in node types. A node may also name a type of its own, so the build publishes
      this list open to any other string.
    exact_mappings:
    - calm_meta:core.json#/defs/node-type-definition
    permissible_values:
      actor:
        description: A person or system outside the architecture that acts on it.
      ecosystem:
        description: A group of systems that work together.
      system:
        description: A system made of other nodes.
      service:
        description: A service that runs in the architecture.
      database:
        description: A store of data.
      network:
        description: A network that nodes are deployed in.
      ldap:
        description: A directory service reached over LDAP.
      webclient:
        description: A client that runs in a web browser.
      data-asset:
        title: data asset
        description: A body of data the architecture holds or moves.
  CalmTransitionDirection:
    description: The direction of a transition along its relationship.
    permissible_values:
      source-to-destination:
        title: source to destination
        description: From the relationship's source to its destination.
      destination-to-source:
        title: destination to source
        description: From the relationship's destination back to its source.
  CalmDecoratorTargetType:
    description: The kinds of CALM document a decorator can target.
    permissible_values:
      architecture:
        description: An architecture document.
  CalmTimeUnitName:
    description: The units a time unit counts in.
    permissible_values:
      nanoseconds:
        description: Billionths of a second.
      microseconds:
        description: Millionths of a second.
      milliseconds:
        description: Thousandths of a second.
      seconds:
        description: Seconds.
      minutes:
        description: Minutes.
      hours:
        description: Hours.
      days:
        description: Days.
      weeks:
        description: Weeks.
      months:
        description: Calendar months.
      quarters:
        description: Quarters of a year.
      years:
        description: Years.
  CalmRateInterval:
    description: The interval a rate is counted over.
    permissible_values:
      nanosecond:
        description: Per billionth of a second.
      microsecond:
        description: Per millionth of a second.
      millisecond:
        description: Per thousandth of a second.
      second:
        description: Per second.
      minute:
        description: Per minute.
      hour:
        description: Per hour.
      day:
        description: Per day.
      week:
        description: Per week.
      month:
        description: Per calendar month.
      quarter:
        description: Per quarter of a year.
      year:
        description: Per year.
types:
  CalmCronExpression:
    typeof: string
    title: Cron Expression
    description: A valid Unix-style cron expression.
    pattern: ^([0-5]?\d)\s([01]?\d|2[0-3])\s(3[01]|[12]\d|0?[1-9])\s(1[0-2]|0?[1-9])\s([0-6])$
    exact_mappings:
    - calm_meta:units.json#/defs/cron-expression
    comments:
    - CALM's pattern accepts only numbers, so it refuses all three of CALM's own examples, each of which
      holds an asterisk. The build copies the examples as CALM gives them, and tests/test_parity.py records
      the fault.
    examples:
    - value: 0 0 * * 0
    - value: 30 14 1 * 5
    - value: 15 10 * * *
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: CalmNode, CalmRelationship, CalmFlow,
  CalmControlRequirement; folded into LOKF''s: CalmControl.description -> description, CalmNode.name ->
  title, CalmNode.description -> description, CalmRelationship.description -> description, CalmDecision.description
  -> description, CalmFlow.name -> title, CalmFlow.description -> description, CalmTransition.description
  -> description, CalmControlRequirement.name -> title, CalmControlRequirement.description -> description.'
