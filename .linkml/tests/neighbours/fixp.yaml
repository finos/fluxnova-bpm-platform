      sbe_template_id: '16'
      sbe_name: FinishedReceiving
      fixp_sent_by: any
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'true'
      fixp_flow_of: peer
  FixpApplied:
    is_a: FixpMessage
    description: An optional application message telling the party that sends an idempotent flow which
