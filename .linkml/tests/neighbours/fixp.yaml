    - request_timestamp
    - keepalive_interval
    - next_seq_no
    slot_usage:
      session_id:
        required: true
      request_timestamp:
        required: true
        description: The request_time of the Establish this message accepts.
      keepalive_interval:
        required: true
        description: The longest the server stays silent, in milliseconds, before a heartbeat.
      next_seq_no:
        description: If the server's flow is recoverable, the number its next application message will
