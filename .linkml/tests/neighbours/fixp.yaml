        required: true
    annotations:
      sbe_template_id: '3'
      sbe_name: NegotiationReject
      fixp_sent_by: server
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpTopic:
    is_a: FixpMessage
    description: A multicast publisher's notice that starts a flow and ties the session's short-lived
