    annotations:
      sbe_template_id: '9'
      sbe_name: Context
      fixp_sent_by: any
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'true'
      fixp_flow_of: own
  FixpUnsequencedHeartbeat:
    is_a: FixpMessage
    description: Shows the peer that the session and transport are alive when the sender's flow is unsequenced
      or empty. It has no fields.
    in_subset:
    - fixp_transferring
    annotations:
      sbe_template_id: '10'
      sbe_name: UnsequencedHeartbeat
      fixp_sent_by: any
      fixp_flow_types: Unsequenced None
      fixp_multicast: 'false'
      fixp_flow_of: own
  FixpRetransmitRequest:
    is_a: FixpMessage
    description: Asks the peer to resend some messages of its recoverable flow. A party has at most one
      such request open at a time.
    in_subset:
    - fixp_transferring
    slots:
    - session_id
    - request_time
    - from_seq_no
    - message_count
    slot_usage:
      session_id:
        required: true
      request_time:
        required: true
        description: When the request was made, which also tells this request apart from others.
      from_seq_no:
        required: true
        description: Where the requested run starts, by sequence number.
      message_count:
        required: true
