    annotations:
      sbe_template_id: '11'
      sbe_name: RetransmitRequest
      fixp_sent_by: any
      fixp_flow_types: Recoverable
      fixp_multicast: 'false'
      fixp_flow_of: peer
  FixpRetransmission:
    is_a: FixpMessage
