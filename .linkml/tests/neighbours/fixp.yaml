    annotations:
      sbe_template_id: '18'
      sbe_name: NotApplied
      fixp_sent_by: any
      fixp_flow_types: Idempotent
      fixp_multicast: 'false'
      fixp_flow_of: peer
  FixpMessageTemplate:
    is_a: FixpMessage
