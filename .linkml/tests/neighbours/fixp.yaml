    in_subset:
    - fixp_binding
    slots:
    - session_id
    - request_time
    - keepalive_interval
    - next_seq_no
    - credentials
    slot_usage:
      session_id:
        required: true
      request_time:
        required: true
      keepalive_interval:
        required: true
        description: The longest the client stays silent, in milliseconds, before a heartbeat.
      next_seq_no:
        description: When the client's recoverable flow is bound again, the number its next application
