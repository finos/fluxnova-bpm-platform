      credentials:
        description: Data that identifies the client, in a form the two parties agree on.
    annotations:
      sbe_template_id: '5'
      sbe_name: Establish
      fixp_sent_by: client
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpEstablishmentAck:
    is_a: FixpMessage
