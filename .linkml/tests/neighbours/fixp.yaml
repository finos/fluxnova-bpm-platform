    annotations:
      sbe_template_id: '6'
      sbe_name: EstablishmentAck
      fixp_sent_by: server
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpEstablishmentReject:
    is_a: FixpMessage
    description: A server's refusal of the binding.
    in_subset:
    - fixp_binding
    slots:
    - session_id
    - request_timestamp
    - establishment_reject_code
    - reason_text
    slot_usage:
      session_id:
        required: true
      request_timestamp:
        required: true
        description: The request_time of the Establish this message refuses.
      establishment_reject_code:
        required: true
    annotations:
      sbe_template_id: '7'
      sbe_name: EstablishmentReject
      fixp_sent_by: server
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpSequence:
    is_a: FixpMessage
    description: Starts the numbering of a sequenced flow, so that the application messages after it are
      numbered by counting up from the value it carries. Sent when idle, it is also the heartbeat.
    comments:
    - It is used on a transport that carries one session; Context replaces it on a shared one.
    in_subset:
    - fixp_transferring
    slots:
    - next_seq_no
    slot_usage:
      next_seq_no:
        required: true
    annotations:
      sbe_template_id: '8'
      sbe_name: Sequence
      fixp_sent_by: any
      fixp_flow_types: Recoverable Idempotent
      fixp_multicast: 'true'
      fixp_flow_of: own
  FixpContext:
    is_a: FixpMessage
    description: On a transport that several sessions share, names the session the following messages
      belong to and, when the flow is sequenced, where its numbering continues.
    in_subset:
    - fixp_transferring
    slots:
    - session_id
    - next_seq_no
    slot_usage:
      session_id:
        required: true
      next_seq_no:
        comments:
        - Section 3's table makes it optional, and both resource files make it required, so the schema
