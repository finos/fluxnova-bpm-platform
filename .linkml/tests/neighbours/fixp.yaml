        required: true
      termination_code:
        required: true
    annotations:
      sbe_template_id: '14'
      sbe_name: Terminate
      fixp_sent_by: any
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
