id: https://w3id.org/lmodel/fixp-lokf
name: fixp
title: FIX Performance Session Layer (FIXP)
description: A LinkML model of the FIX Performance Session Layer 1.0, the FIX Trading Community's session
  protocol for fast trading links. It describes FIXP's session messages, their fields and value lists,
  exchanges of those messages on one session, and the rules of engagement two parties agree on. A message
  is described by its fields, so the model works with any encoding.
version: '1.0'
source: https://github.com/FIXTradingCommunity/fixp-specification/tree/v1.0-STANDARD/v1-0-STANDARD
license: Apache-2.0
keywords:
- FIX
- FIXP
- session layer
- trading
see_also:
- https://lmodel.github.io/fixp
- https://github.com/FIXTradingCommunity/fixp-specification
annotations:
  upstream_tag: v1.0-STANDARD
  upstream_commit: 6d89f5fa66d544ea6b41e93853c23292505e49c6
  sbe_package: FIXP
  sbe_schema_id: '2748'
  sbe_schema_version: '0'
  sbe_byte_order: littleEndian
comments:
- An exchange starts at FixpExchange, the tree root. A single message validates against its own class,
  such as FixpNegotiate, and a rules-of-engagement record against FixpRulesOfEngagement. upstream/ holds
  the specification's resource files unchanged, tests/test_coverage.py compares the modules with them,
  and scripts/check_upstream_release.py reports when they change.
prefixes:
  fixp: https://w3id.org/lmodel/fixp/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  fix_sbe: https://w3id.org/lmodel/fix-sbe/
  fix_orchestra: https://w3id.org/lmodel/fix-orchestra/
default_prefix: fixp
default_range: string
imports:
- linkml:types
- lokf
classes:
  FixpMessage:
    abstract: true
    description: One FIXP message, as its fields would be read from the wire before or after encoding.
    comments:
    - The FIXP files define each message as an SBE message template, which lmodel/fix-sbe models as SbeMessageV1,
      and as an Orchestra message, which lmodel/fix-orchestra models as OrchestraMessageV10. A record
      of those classes defines a kind of message; an instance of this class is one message of that kind.
    related_mappings:
    - fix_sbe:SbeMessageV1
    - fix_orchestra:OrchestraMessageV10
    slots:
    - message_kind
  FixpNegotiate:
    is_a: FixpMessage
    description: A client's request to create a session under an identifier it has never used, stating
      the flow type it will send.
    in_subset:
    - fixp_initialization
    slots:
    - session_id
    - request_time
    - client_flow
    - credentials
    slot_usage:
      session_id:
        required: true
      request_time:
        required: true
      client_flow:
        required: true
      credentials:
        description: Data that identifies the client, in a form the two parties agree on.
    annotations:
      sbe_template_id: '1'
      sbe_name: Negotiate
      fixp_sent_by: client
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpNegotiationResponse:
    is_a: FixpMessage
    description: A server's acceptance of a new session, stating the flow type it will send back.
    in_subset:
    - fixp_initialization
    slots:
    - session_id
    - request_timestamp
    - server_flow
    - credentials
    slot_usage:
      session_id:
        required: true
      request_timestamp:
        required: true
        description: The request_time of the Negotiate this message accepts.
      server_flow:
        required: true
      credentials:
        description: Data that identifies the server to the client, for mutual authentication.
    annotations:
      sbe_template_id: '2'
      sbe_name: NegotiationResponse
      fixp_sent_by: server
      fixp_flow_types: Recoverable Idempotent Unsequenced None
      fixp_multicast: 'false'
  FixpNegotiationReject:
