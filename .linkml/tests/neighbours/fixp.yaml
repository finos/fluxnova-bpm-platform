      topic_classification:
        required: true
    annotations:
      sbe_template_id: '4'
      sbe_name: Topic
      fixp_sent_by: publisher
      fixp_multicast: 'true'
  FixpEstablish:
    is_a: FixpMessage
    description: A client's request to tie a negotiated session to the very transport this message arrives
