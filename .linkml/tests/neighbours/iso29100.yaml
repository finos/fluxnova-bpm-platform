# Generated by `lokf adapt` from iso29100.yaml (iso29100 2024); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/iso29100-lokf
name: iso29100
title: ISO/IEC 29100:2024 privacy framework records
description: A LinkML model of the records an organization keeps when it applies the privacy framework
  of ISO/IEC 29100:2024 to the information and communication technology (ICT) systems that handle personally
  identifiable information (PII). The records say who takes part, which PII is involved and how it moves,
  what must be safeguarded and how, and how the organization stands against each privacy principle.
version: '2024'
source: https://www.iso.org/standard/85938.html
license: Apache-2.0
see_also:
- https://lmodel.github.io/iso29100
- https://www.iso.org/standard/85938.html
annotations:
  standard: ISO/IEC 29100:2024
  edition: '2'
  publication_date: '2024-02-16'
  replaces: ISO/IEC 29100:2011, ISO/IEC 29100:2011/Amd 1:2018
  iso_open_data_date: '2026-11-05'
comments:
- The version is the edition the schema models, and source is ISO's page for it. ISO Open Data's records
  of the edition and of the two it replaced are copied to src/iso29100/schema/iso-open-data/ on the date
  the annotations give, and scripts/check_upstream_release.py reports when ISO changes them. The release
  tags are the schema's own versions.
- ISO/IEC 29100 is copyright ISO and IEC, and none of its text is reproduced here. An element's title
  and description are this project's own words. An element cites what it models by number in the iso29100_clause
  annotation only where a third party's public outline of the edition gives that number, so terms and
  lower subclauses go uncited. A reader with a licensed copy looks the text up there.
- Every record that other records refer to has a pf_id, and a reference holds that identifier. PfFramework
  holds each kind of record in a list of its own.
- The mappings to the Data Privacy Vocabulary (DPV) are the five rows DPV publishes for this edition,
  in upstream/dpv-iso.ttl, with DPV's direction kept. No other mapping is declared, because no source
  states one.
default_prefix: iso29100
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  iso29100: https://w3id.org/lmodel/iso29100/
  dpv: https://w3id.org/dpv#
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
- linkml:types
- lokf
types:
  pf_duration:
    typeof: string
    base: str
    uri: xsd:duration
    description: A length of time as ISO 8601 writes it, such as P7Y for seven years or P30D for thirty
      days.
    pattern: ^P(?=[0-9T])([0-9]+Y)?([0-9]+M)?([0-9]+W)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$
slots:
  pf_actor_type:
    description: 'The kind of actor: PfPiiPrincipal, PfPiiController, PfPiiProcessor or PfThirdParty.'
    range: string
  pf_jurisdictions:
    description: The legal systems that apply to the record, in the organization's terms.
    multivalued: true
  pf_purposes:
    description: The reasons the PII is processed, in the organization's own words.
    multivalued: true
  pf_legal_bases:
    description: What makes the processing lawful, in the terms of the law that applies.
    multivalued: true
  pf_operations:
    description: The things done to the PII.
    range: PfOperation
    multivalued: true
  pf_retention:
    description: How long the PII is kept, as an ISO 8601 duration.
    range: pf_duration
  pf_principles:
    description: The privacy principles the record bears on.
    range: PfPrinciple
    multivalued: true
  pf_concerned_pii:
    description: The PII items the record concerns.
    range: PfPiiItem
    multivalued: true
  pf_concerned_principals:
    description: The people the PII of the record is about.
    range: PfPiiPrincipal
    multivalued: true
  pf_principal:
    description: The person the record is about.
    range: PfPiiPrincipal
  pf_related_controls:
    description: The organization's controls that act on the record's subject.
    range: PfControl
    multivalued: true
  pf_evidence:
    description: What shows that the record's claim holds, such as a report or a log.
    multivalued: true
enums:
  PfPrinciple:
    description: The privacy principles by their subclause numbers. A value's title and description are
      this project's own summary, and the principles' headings and wording are ISO's.
    annotations:
      iso29100_clause: '6.1'
    permissible_values:
      principle_6_2:
        title: 6.2 People decide
        description: People get a say in whether their PII is processed, can agree or refuse purpose by
          purpose, and can change their minds later.
        annotations:
          iso29100_clause: '6.2'
      principle_6_3:
        title: 6.3 Lawful, stated reasons
        description: The law allows each reason for processing, and people are told the reason before
          their PII is gathered, or at that moment.
        annotations:
          iso29100_clause: '6.3'
      principle_6_4:
        title: 6.4 Gather within bounds
        description: The organization gathers only the PII that the law allows and its stated reasons
          need.
        annotations:
          iso29100_clause: '6.4'
      principle_6_5:
        title: 6.5 A small footprint
        description: Systems and procedures are built to touch as little PII as they can, and as few people
          as possible can reach it.
        annotations:
          iso29100_clause: '6.5'
      principle_6_6:
        title: 6.6 Bounded use and keeping
        description: PII is used, shared and kept only as far as the stated reasons go, and is safely
          disposed of afterwards.
        annotations:
          iso29100_clause: '6.6'
      principle_6_7:
        title: 6.7 Correct and fit
        description: PII stays right, whole, up to date and suited to its use, and there are ways to check
          and fix it.
        annotations:
          iso29100_clause: '6.7'
      principle_6_8:
        title: 6.8 Say what happens
        description: People can easily find out what the organization does with PII, and hear about important
          changes.
        annotations:
          iso29100_clause: '6.8'
      principle_6_9:
        title: 6.9 People see their own
        description: People can look at the PII held about them and dispute it, within what the law allows.
        annotations:
          iso29100_clause: '6.9'
      principle_6_10:
        title: 6.10 Answer for it
        description: The organization writes down its duties, keeps protection in place when PII passes
          to others, and handles complaints and redress.
        annotations:
          iso29100_clause: '6.10'
      principle_6_11:
        title: 6.11 Keep it safe
        description: Security measures at every level guard PII against loss and unauthorized reach for
          as long as it is held.
        annotations:
          iso29100_clause: '6.11'
      principle_6_12:
        title: 6.12 Show the rules are met
        description: The organization checks, and can prove, that it meets its privacy duties, through
          audits and regular risk assessment.
        annotations:
          iso29100_clause: '6.12'
  PfOperation:
    description: The things an organization can do to PII.
    permissible_values:
      collect:
        description: Get PII from the person it is about, or from another source.
      store:
        description: Hold PII on a lasting medium.
      retrieve:
        description: Fetch stored PII for use.
      consult:
        description: Look at PII without taking a copy away.
      alter:
        description: Change PII that is already held.
      pseudonymize:
        description: Swap identifying details for an alias, in a way someone can still trace back.
      anonymize:
        description: Change PII so that nobody can trace it back to a person again.
      disclose:
        description: Make PII available to another party.
      disseminate:
        description: Spread PII widely, such as by publishing it.
      delete:
        description: Remove PII so that it can no longer be reached or used.
      destroy:
        description: Remove PII and whatever carried it, beyond recovery.
  PfPiiRecognition:
    description: The ways information turns out to be PII, which a record lists so that a reader can see
      why the item counts.
    annotations:
      iso29100_clause: '5.4'
    permissible_values:
      direct_identifier:
        description: It singles out one person by itself, such as a passport number.
      distinguishing_trait:
        description: It sets one person apart, alone or with other details, such as a rare job title in
          a small town.
      linked_information:
        description: It says something about a person who is already known, or can be joined to a record
          that does.
      pseudonym:
        description: It holds an alias in place of an identifier, and the alias can be traced.
      metadata:
        description: It describes other data, such as a message's sender and time, and so reveals a person.
      unsolicited:
        description: The organization received it without asking for it.
  PfSensitivity:
    description: How much harm the PII could do to the person it is about.
    annotations:
      iso29100_clause: '5.4'
    permissible_values:
      ordinary:
        description: It needs the usual protection for PII.
      sensitive:
        description: Its misuse could badly harm the person, or a law sets it apart, such as health data,
          so it needs stronger protection.
  PfRequirementFactor:
    description: Where a requirement to safeguard PII comes from.
    annotations:
      iso29100_clause: '5.5'
    permissible_values:
      law:
        description: A statute, a regulation, a court's ruling or a collective agreement.
      contract:
        description: An agreement between parties, such as one with a processor, or rules that bind a
          group of companies.
      business:
        description: How the business or its application works, or a code of practice it chose to follow.
      other:
        description: Another source, such as what people have said they prefer, or a technical standard
          the organization adopted.
  PfPolicyAudience:
    description: Who a privacy policy is written for.
    annotations:
      iso29100_clause: '5.6'
    permissible_values:
      internal:
        description: People inside the organization, who act on its commitments.
      public_notice:
        description: The people whose PII it handles, who read it to learn what happens.
  PfControlKind:
    description: The form a control takes.
    annotations:
      iso29100_clause: '5.7'
    permissible_values:
      organizational:
        description: A policy, a procedure, a role or another way of running things.
      physical:
        description: A measure that guards the places and equipment where PII sits.
      technical:
        description: A system, product or service that protects PII.
      privacy_enhancing_technology:
        description: A technical measure built to reduce what is collected or revealed about people.
      contractual:
        description: A binding agreement, such as one with a processor or across a group of companies.
  PfImplementationState:
    description: How far a control has been put into effect.
    permissible_values:
      planned:
        description: It is decided on but not started.
      in_progress:
        description: It is being put in place.
      in_operation:
        description: It is in place and working.
      retired:
        description: It is no longer in use.
  PfRiskLevel:
    description: A qualitative level of risk to people, offered for an organization that adopts it, since
      the framework leaves the scale to the organization.
    permissible_values:
      low:
        description: The harm to people would be limited.
      medium:
        description: The harm would call for planned measures.
      high:
        description: The harm could be serious.
      very_high:
        description: The harm could be severe or lasting, and needs treating at once.
  PfConsentMechanism:
    description: How a person's agreement to processing is obtained.
    permissible_values:
      opt_in:
        description: The person acts to agree before the processing starts.
      opt_out:
        description: The processing goes ahead unless the person acts to refuse it.
      implied:
        description: Something the person does shows agreement, such as placing an order, where the law
          allows that reading.
  PfConsentState:
    description: Where a person's agreement stands.
    permissible_values:
      given:
        description: The agreement holds.
      refused:
        description: The person said no.
      withdrawn:
        description: The person took back an agreement they had given.
      expired:
        description: The agreement ran out.
classes:
  PfRecordMixin:
    mixin: true
    description: 'What every record of the framework has, so that other records can refer to it: an identifier,
      a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record classes on LOKF's
      Concept and leave the others as they are. lokf adapt replaces pf_id with LOKF's id, and a class
      that declares id itself must descend from Concept.
    slots:
    - id
    - title
    - description
    slot_usage:
      title:
        required: true
        pattern: ^\s*\S
        range: string
      description:
        range: string
  PfFramework:
    mixins:
    - PfRecordMixin
    description: 'One organization''s use of the privacy framework: the systems it covers, and every record
      the organization keeps about them, each kind in a list of its own.'
    annotations:
      iso29100_clause: '5.1'
    slots:
    - pf_jurisdictions
    attributes:
      pf_organization:
        description: The organization that applies the framework.
        required: true
      pf_ict_systems:
        description: The ICT systems the framework covers.
        multivalued: true
      pf_actors:
        description: Those who take part in handling the PII.
        range: PfActor
        multivalued: true
        inlined_as_list: true
      pf_pii_items:
        description: The PII the organization has recognized.
        range: PfPiiItem
        multivalued: true
        inlined_as_list: true
      pf_flows:
        description: The ways PII passes between the actors.
        range: PfPiiFlow
        multivalued: true
        inlined_as_list: true
      pf_processing_activities:
        description: What the organization does with PII.
        range: PfProcessingActivity
        multivalued: true
        inlined_as_list: true
      pf_safeguarding_requirements:
        description: What the organization must do to safeguard PII.
        range: PfSafeguardingRequirement
        multivalued: true
        inlined_as_list: true
      pf_policies:
        description: The organization's privacy policies.
        range: PfPolicy
        multivalued: true
        inlined_as_list: true
      pf_controls:
        description: The organization's controls.
        range: PfControl
        multivalued: true
        inlined_as_list: true
      pf_principle_implementations:
        description: How the organization stands against each privacy principle.
        range: PfPrincipleImplementation
        multivalued: true
        inlined_as_list: true
      pf_risks:
        description: The risks to people that the organization has identified.
        range: PfRisk
        multivalued: true
        inlined_as_list: true
      pf_impact_assessments:
        description: The organization's privacy impact assessments.
        range: PfImpactAssessment
        multivalued: true
        inlined_as_list: true
      pf_breaches:
        description: The breaches the organization has recorded.
        range: PfBreach
        multivalued: true
        inlined_as_list: true
      pf_consents:
        description: The consents the organization holds.
        range: PfConsent
        multivalued: true
        inlined_as_list: true
      pf_preferences:
        description: What people have said they prefer.
        range: PfPreference
        multivalued: true
        inlined_as_list: true
  PfActor:
    abstract: true
    mixins:
    - PfRecordMixin
    description: Someone who takes part in handling PII, told apart by the part they play. One party can
      play different parts for different PII, with a record for each.
    annotations:
      iso29100_clause: '5.2'
    slots:
    - pf_actor_type
    - pf_jurisdictions
    slot_usage:
      pf_actor_type:
        required: true
    attributes:
      pf_contact:
        description: How to reach the actor about privacy.
    is_a: Concept
  PfPiiPrincipal:
    is_a: PfActor
    description: The person the PII is about, or a group of such people when the organization records
      them together.
    annotations:
      iso29100_clause: '5.2'
    exact_mappings:
    - dpv:DataSubject
  PfPiiController:
    is_a: PfActor
    description: The party that decides why and how PII is processed, and answers for it even when another
      party does the work.
    annotations:
      iso29100_clause: '5.2'
    exact_mappings:
    - dpv:DataController
    slots:
    - pf_purposes
    - pf_legal_bases
    attributes:
      pf_appointed_processors:
        description: The processors that work for the controller.
        range: PfPiiProcessor
        multivalued: true
      pf_controller_policy:
        description: The privacy policy the controller works under.
        range: PfPolicy
      pf_privacy_officer:
        description: The person who advises the controller on privacy, where there is one.
  PfPiiProcessor:
    is_a: PfActor
    description: A party that processes PII for a controller, on that controller's instructions.
    annotations:
      iso29100_clause: '5.2'
    exact_mappings:
    - dpv:DataProcessor
    attributes:
      pf_instructing_controllers:
        description: The controllers whose instructions the processor follows.
        range: PfPiiController
        multivalued: true
      pf_processing_agreement:
        description: The reference of the agreement that binds the processor, where there is one.
      pf_sub_processors:
        description: The processors this processor has engaged in turn.
        range: PfPiiProcessor
        multivalued: true
  PfThirdParty:
    is_a: PfActor
    description: A party outside the controller and its processors that receives PII for its own ends,
      and usually becomes a controller of that PII.
    annotations:
      iso29100_clause: '5.2'
    attributes:
      pf_receiving_purpose:
        description: What the third party receives the PII for.
      pf_transfer_basis:
        description: What makes the passing of PII to the third party lawful.
  PfPiiItem:
    mixins:
    - PfRecordMixin
    description: A piece or set of information that can be tied to a person, why it counts as PII, how
      sensitive it is and how it is handled.
    annotations:
      iso29100_clause: '5.4'
    comments:
    - DPV's mapping says dpv:PersonalData is narrower than the standard's PII, and this class keeps that
      direction.
    narrow_mappings:
    - dpv:PersonalData
    slots:
    - pf_concerned_principals
    - pf_operations
    - pf_retention
    attributes:
      pf_pii_categories:
        description: What the item holds, in the organization's own words.
        multivalued: true
      pf_recognized_by:
        description: Why the information counts as PII.
        range: PfPiiRecognition
        multivalued: true
      pf_sensitivity:
        description: How sensitive the item is.
        range: PfSensitivity
      pf_pseudonymized:
        description: Whether an alias stands in for the item's identifying details.
        range: boolean
      pf_linkability:
        description: How easily the item could be joined with other data to identify someone, in the organization's
          words.
    is_a: Concept
  PfPiiFlow:
    mixins:
    - PfRecordMixin
    description: One way PII passes from one actor to another, and who decides what happens to it afterwards.
    annotations:
      iso29100_clause: '5.3'
    slots:
    - pf_concerned_pii
    attributes:
      pf_provider:
        description: The actor the PII comes from.
        range: PfActor
        required: true
      pf_recipient:
        description: The actor the PII goes to.
        range: PfActor
        required: true
      pf_decides_afterwards:
        description: The actor that decides what happens to the PII once it has passed. A processor never
          holds this position.
        range: PfActor
  PfProcessingActivity:
    mixins:
    - PfRecordMixin
    description: 'Something the organization does with PII: why, on what basis, what it does to which
      PII, who is responsible, and how long the PII is kept.'
    comments:
    - The fields are what an adopter keeps. The framework's own subject here is what counts as processing,
      which PfOperation lists.
    slots:
    - pf_purposes
    - pf_legal_bases
    - pf_operations
    - pf_concerned_pii
    - pf_retention
    - pf_related_controls
    attributes:
      pf_controller:
        description: The controller that answers for the activity.
        range: PfPiiController
        required: true
      pf_processors:
        description: The processors that do the work.
        range: PfPiiProcessor
        multivalued: true
      pf_activity_flows:
        description: The flows of PII the activity involves.
        range: PfPiiFlow
        multivalued: true
      pf_sensitivities:
        description: The levels of sensitivity among the PII involved.
        range: PfSensitivity
        multivalued: true
      pf_crosses_borders:
        description: Whether PII leaves the jurisdiction it was collected in.
        range: boolean
      pf_transfer_safeguards:
        description: What protects the PII when it crosses a border.
        multivalued: true
    is_a: Concept
  PfSafeguardingRequirement:
    mixins:
    - PfRecordMixin
    description: Something the organization must do to protect PII, and where that duty comes from.
    annotations:
      iso29100_clause: '5.5'
    attributes:
      pf_requirement_factor:
        description: Where the requirement comes from.
        range: PfRequirementFactor
        required: true
      pf_requirement_source:
        description: The law, contract or other document that states it.
      pf_applies_to:
        description: The actors that must meet it.
        range: PfActor
        multivalued: true
      pf_met_by:
        description: The controls that meet it.
        range: PfControl
        multivalued: true
    is_a: Concept
  PfPolicy:
    mixins:
    - PfRecordMixin
    description: 'A privacy policy: what the organization commits to about PII, written for its own people
      or as a notice to the people whose PII it handles.'
    annotations:
      iso29100_clause: '5.6'
    slots:
    - pf_purposes
    - pf_concerned_pii
    - pf_principles
    attributes:
      pf_policy_audience:
        description: Who the policy is written for.
        range: PfPolicyAudience
        required: true
      pf_policy_version:
        description: The version of the policy.
      pf_policy_scope:
        description: What the policy covers.
      pf_policy_effective_date:
        description: When the policy takes effect.
        range: date
      pf_policy_last_reviewed:
        description: When the policy was last reviewed.
        range: date
      pf_retention_statement:
        description: What the policy says about how long PII is kept.
      pf_stated_rights:
        description: The rights the policy tells people they have.
        multivalued: true
      pf_inquiry_contact:
        description: Where people can send questions about the policy.
    is_a: Concept
  PfControl:
    mixins:
    - PfRecordMixin
    description: A measure that treats a privacy risk by making it less likely or less harmful, the principles
      it serves and how far it has been put into effect.
    annotations:
      iso29100_clause: '5.7'
    slots:
    - pf_principles
    - pf_evidence
    attributes:
      pf_control_kind:
        description: The form the control takes.
        range: PfControlKind
        required: true
      pf_control_objective:
        description: What the control is meant to achieve.
      pf_control_detail:
        description: How the control is put into effect.
      pf_control_responsible:
        description: The actor that answers for the control.
        range: PfActor
      pf_control_state:
        description: How far the control has been put into effect.
        range: PfImplementationState
      pf_answers_requirements:
        description: The safeguarding requirements the control answers to.
        range: PfSafeguardingRequirement
        multivalued: true
    is_a: Concept
  PfPrincipleImplementation:
    mixins:
    - PfRecordMixin
    description: 'How the organization stands against one privacy principle: what it does, what shows
      it, and what is still missing.'
    annotations:
      iso29100_clause: '6.1'
    slots:
    - pf_related_controls
    - pf_evidence
    attributes:
      pf_principle:
        description: The principle the record is about.
        range: PfPrinciple
        required: true
      pf_measures:
        description: What the organization does to follow the principle.
        multivalued: true
      pf_gaps:
        description: Where the organization falls short.
        multivalued: true
      pf_improvements:
        description: What the organization will do about the gaps.
        multivalued: true
      pf_last_assessed:
        description: When the organization last checked its standing.
        range: date
    is_a: Concept
  PfRisk:
    mixins:
    - PfRecordMixin
    description: 'A way that handling PII could harm people: where the risk comes from, how likely and
      how bad it is, and what is done about it.'
    comments:
    - The framework names privacy risk as an idea and leaves the scale to the organization. These fields
      are what an adopter keeps.
    slots:
    - pf_concerned_pii
    - pf_concerned_principals
    - pf_related_controls
    attributes:
      pf_risk_source:
        description: Where the risk comes from.
      pf_risk_likelihood:
        description: How likely the harm is, in the organization's own terms.
      pf_risk_consequence:
        description: What the harm to people would be.
      pf_risk_inherent_level:
        description: The risk's level before controls.
        range: PfRiskLevel
      pf_risk_residual_level:
        description: The risk's level after controls, which is never above the level before.
        range: PfRiskLevel
      pf_risk_owner:
        description: The person who answers for the risk.
    is_a: Concept
  PfImpactAssessment:
    mixins:
    - PfRecordMixin
    description: A review of what a system or activity could do to people's privacy, the risks it found
      and what became of them.
    comments:
    - These fields are what an adopter keeps, and go beyond the framework itself.
    attributes:
      pf_assessment_scope:
        description: What the assessment looks at.
      pf_assessment_date:
        description: When the assessment was done.
        range: date
      pf_assessor:
        description: Who did the assessment.
      pf_assessed_activities:
        description: The processing activities it looks at.
        range: PfProcessingActivity
        multivalued: true
      pf_risks_found:
        description: The risks it found.
        range: PfRisk
        multivalued: true
      pf_risks_treated:
        description: Those of the risks found that have been treated.
        range: PfRisk
        multivalued: true
      pf_risks_accepted:
        description: Those of the risks found that the organization has accepted as they stand.
        range: PfRisk
        multivalued: true
      pf_assessment_outcome:
        description: What the assessment concluded.
      pf_consultations:
        description: Who was asked, and what they said.
        multivalued: true
      pf_next_assessment:
        description: When the next assessment is due, which is after this one.
        range: date
    is_a: Concept
  PfBreach:
    mixins:
    - PfRecordMixin
    description: 'A time when PII was handled against a safeguarding requirement: what happened, who was
      told and what was done.'
    comments:
    - The framework names the idea of a breach. These fields are what an adopter keeps, and go beyond
      the framework itself.
    slots:
    - pf_concerned_pii
    attributes:
      pf_breach_occurred:
        description: When the breach happened.
        range: datetime
      pf_breach_discovered:
        description: When the organization found out, which is not before it happened.
        range: datetime
      pf_breach_closed:
        description: When the organization closed the matter, which is not before it found out.
        range: datetime
      pf_principals_affected:
        description: How many people the breach reached, where that is known.
        range: integer
        minimum_value: 1
      pf_breached_requirements:
        description: The safeguarding requirements the breach went against.
        range: PfSafeguardingRequirement
        multivalued: true
      pf_breach_severity:
        description: How serious the breach is.
        range: PfRiskLevel
      pf_immediate_actions:
        description: What was done straight away.
        multivalued: true
      pf_notification_required:
        description: Whether a law or contract requires anyone to be told.
        range: boolean
      pf_notifications:
        description: Who was told, and when.
        multivalued: true
      pf_remediation:
        description: What was done to put things right.
        multivalued: true
      pf_lessons:
        description: What the organization learned.
  PfConsent:
    mixins:
    - PfRecordMixin
    description: One person's agreement to the processing of their PII for stated purposes, and where
      it stands.
    comments:
    - The framework defines consent and its principle, and DPV maps that term to dpv:InformedConsent.
      The fields are what an adopter keeps, and go beyond the framework itself.
    exact_mappings:
    - dpv:InformedConsent
    rules:
    - title: a withdrawal date means the consent is withdrawn
      description: A consent with a withdrawal date has the state withdrawn.
      preconditions:
        slot_conditions:
          pf_consent_withdrawn:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          pf_consent_state:
            equals_string: withdrawn
    slots:
    - pf_purposes
    - pf_concerned_pii
    - pf_evidence
    - pf_principal
    slot_usage:
      pf_principal:
        required: true
    attributes:
      pf_consent_mechanism:
        description: How the agreement was obtained.
        range: PfConsentMechanism
      pf_consent_given:
        description: When the person agreed.
        range: datetime
      pf_consent_state:
        description: Where the agreement stands.
        range: PfConsentState
        required: true
      pf_consent_withdrawn:
        description: When the person took the agreement back.
        range: datetime
  PfPreference:
    mixins:
    - PfRecordMixin
    description: What one person has said they want done, or not done, with their PII.
    comments:
    - The framework names the idea of a privacy preference. These fields are what an adopter keeps, and
      go beyond the framework itself.
    slots:
    - pf_principal
    slot_usage:
      pf_principal:
        required: true
    attributes:
      pf_preference_scope:
        description: What the preference applies to.
      pf_wants_anonymity:
        description: Whether the person asks not to be identified at all.
        range: boolean
      pf_wants_pseudonymity:
        description: Whether the person asks to appear under an alias.
        range: boolean
      pf_refused_operations:
        description: What the person does not want done to their PII.
        range: PfOperation
        multivalued: true
      pf_refused_recipients:
        description: Who the person does not want their PII passed to.
        multivalued: true
      pf_preference_recorded:
        description: When the organization recorded the preference.
        range: date
