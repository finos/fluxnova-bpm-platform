[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays fluxnova_bpm_platform. PyPI publishing is off.
name = "fluxnova-bpm-platform-linkml"
description = "FINOS Fluxnova BPM Platform 3.1.1 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.12.1",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluxnova_bpm_platform"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/fluxnova_bpm_platform/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/fluxnova_bpm_platform/datamodel/fluxnova_bpm_platform_pydantic.py",
  "src/fluxnova_bpm_platform/datamodel/fluxnova_bpm_platform.py",
  # The pin lists, and the neighbours' released adapt copies, are written or
  # copied, not written here.
  "tests/upstream_tree.tsv",
  "scripts/upstream_pins.tsv",
  "tests/neighbours/*",
  # Copied in by the KTL sidecar sync or written by npm, not by hand.
  ".lokf/scripts/*",
  ".lokf/schema/lokf.yaml",
  "website/package-lock.json",
  ".github/release/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke,activiti,anid"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
# Activiti, the engine Camunda and then Fluxnova grew from, names the DDL files.
activiti = "activiti"
# Camunda's extension attribute camunda:writeable, as the model API names it.
writeable = "writeable"

[tool.typos.files]
extend-exclude = [
  # Values copied from FINOS's MockProvider.java, such as aCaseDefnitionId, and
  # short example ids such as ba-001.
  "**/tests/data/valid/**",
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/fluxnova_bpm_platform/datamodel/fluxnova_bpm_platform_pydantic.py",
  "src/fluxnova_bpm_platform/datamodel/fluxnova_bpm_platform.py",
  # The pin lists, and the neighbours' released adapt copies, are written or
  # copied, not written here.
  "tests/upstream_tree.tsv",
  "scripts/upstream_pins.tsv",
  "tests/neighbours/*",
  # Copied in by the KTL sidecar sync or written by npm, not by hand.
  ".lokf/scripts/*",
  ".lokf/schema/lokf.yaml",
  "website/package-lock.json",
  ".github/release/package-lock.json",
]
