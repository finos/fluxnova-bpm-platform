// Which ends of an association an arrow is drawn at.
enum BpmnAssociationDirection {
  BPMN_ASSOCIATION_DIRECTION_UNSPECIFIED = 0;
  BPMN_ASSOCIATION_DIRECTION_NONE = 1;
  BPMN_ASSOCIATION_DIRECTION_ONE = 2;
  BPMN_ASSOCIATION_DIRECTION_BOTH = 3;
}
// How an event-based gateway that starts a process waits for its events.
enum BpmnEventBasedGatewayType {
  BPMN_EVENT_BASED_GATEWAY_TYPE_UNSPECIFIED = 0;
  BPMN_EVENT_BASED_GATEWAY_TYPE_EXCLUSIVE = 1;
  BPMN_EVENT_BASED_GATEWAY_TYPE_PARALLEL = 2;
}
// Whether a gateway splits flows, joins them or does both.
enum BpmnGatewayDirection {
  BPMN_GATEWAY_DIRECTION_UNSPECIFIED = 0;
  BPMN_GATEWAY_DIRECTION_UNSPECIFIED_V2 = 1;
  BPMN_GATEWAY_DIRECTION_CONVERGING = 2;
  BPMN_GATEWAY_DIRECTION_DIVERGING = 3;
  BPMN_GATEWAY_DIRECTION_MIXED = 4;
}
// Whether an item is information or a physical thing.
enum BpmnItemKind {
  BPMN_ITEM_KIND_UNSPECIFIED = 0;
  BPMN_ITEM_KIND_INFORMATION = 1;
  BPMN_ITEM_KIND_PHYSICAL = 2;
}
// Whether the message on a message flow is drawn as the one that starts the exchange.
enum BpmnMessageVisibleKind {
  BPMN_MESSAGE_VISIBLE_KIND_UNSPECIFIED = 0;
  BPMN_MESSAGE_VISIBLE_KIND_INITIATING = 1;
  BPMN_MESSAGE_VISIBLE_KIND_NON_INITIATING = 2;
}
// When a multi-instance activity throws an event as its instances complete.
enum BpmnMultiInstanceFlowCondition {
  BPMN_MULTI_INSTANCE_FLOW_CONDITION_UNSPECIFIED = 0;
  BPMN_MULTI_INSTANCE_FLOW_CONDITION_NONE = 1;
  BPMN_MULTI_INSTANCE_FLOW_CONDITION_ONE = 2;
  BPMN_MULTI_INSTANCE_FLOW_CONDITION_ALL = 3;
  BPMN_MULTI_INSTANCE_FLOW_CONDITION_COMPLEX = 4;
}
// Where a participant band sits on a choreography activity, and whether its participant initiates.
enum BpmnParticipantBandKind {
  BPMN_PARTICIPANT_BAND_KIND_UNSPECIFIED = 0;
  BPMN_PARTICIPANT_BAND_KIND_TOP_INITIATING = 1;
  BPMN_PARTICIPANT_BAND_KIND_MIDDLE_INITIATING = 2;
  BPMN_PARTICIPANT_BAND_KIND_BOTTOM_INITIATING = 3;
  BPMN_PARTICIPANT_BAND_KIND_TOP_NON_INITIATING = 4;
  BPMN_PARTICIPANT_BAND_KIND_MIDDLE_NON_INITIATING = 5;
  BPMN_PARTICIPANT_BAND_KIND_BOTTOM_NON_INITIATING = 6;
}
// Whether a process is private to its participant, public, or neither.
enum BpmnProcessType {
  BPMN_PROCESS_TYPE_UNSPECIFIED = 0;
  BPMN_PROCESS_TYPE_NONE = 1;
  BPMN_PROCESS_TYPE_PUBLIC = 2;
  BPMN_PROCESS_TYPE_PRIVATE = 3;
}
// Which way a relationship points.
enum BpmnRelationshipDirection {
  BPMN_RELATIONSHIP_DIRECTION_UNSPECIFIED = 0;
  BPMN_RELATIONSHIP_DIRECTION_NONE = 1;
  BPMN_RELATIONSHIP_DIRECTION_FORWARD = 2;
  BPMN_RELATIONSHIP_DIRECTION_BACKWARD = 3;
  BPMN_RELATIONSHIP_DIRECTION_BOTH = 4;
}
// How a transaction commits or cancels, by the three values BPMN keeps from BPMN 1.1.
enum BpmnTransactionMethod {
  BPMN_TRANSACTION_METHOD_UNSPECIFIED = 0;
  BPMN_TRANSACTION_METHOD_COMPENSATE = 1;
  BPMN_TRANSACTION_METHOD_IMAGE = 2;
  BPMN_TRANSACTION_METHOD_STORE = 3;
}
// Whether a configuration entry is in effect.
enum ConfigurationStatus {
  CONFIGURATION_STATUS_UNSPECIFIED = 0;
  CONFIGURATION_STATUS_ACTIVE = 1;
  CONFIGURATION_STATUS_INACTIVE = 2;
  CONFIGURATION_STATUS_DELETED = 3;
}
// Where a delegated task stands.
enum DelegationState {
  DELEGATION_STATE_UNSPECIFIED = 0;
  DELEGATION_STATE_PENDING = 1;
  DELEGATION_STATE_RESOLVED = 2;
}
// The state a historic process instance records.
enum HistoricProcessInstanceState {
  HISTORIC_PROCESS_INSTANCE_STATE_UNSPECIFIED = 0;
  HISTORIC_PROCESS_INSTANCE_STATE_ACTIVE = 1;
  HISTORIC_PROCESS_INSTANCE_STATE_SUSPENDED = 2;
  HISTORIC_PROCESS_INSTANCE_STATE_COMPLETED = 3;
  HISTORIC_PROCESS_INSTANCE_STATE_EXTERNALLY_TERMINATED = 4;
  HISTORIC_PROCESS_INSTANCE_STATE_INTERNALLY_TERMINATED = 5;
}
// Whether a historic variable instance still exists.
enum HistoricVariableInstanceState {
  HISTORIC_VARIABLE_INSTANCE_STATE_UNSPECIFIED = 0;
  HISTORIC_VARIABLE_INSTANCE_STATE_CREATED = 1;
  HISTORIC_VARIABLE_INSTANCE_STATE_DELETED = 2;
}
