name: fluxnova_bpm_engine
title: Fluxnova BPM Platform engine tables
description: The tables Fluxnova's process engine keeps in its database, one class per table,
  as the engine's H2 DDL creates them.
version: 3.1.1
source: https://github.com/finos/fluxnova-bpm-platform/tree/3ac64ca2c3d7c93f00395e18b9dc3218e5250264/engine/src/main/resources/org/finos/fluxnova/bpm/engine/db/create
