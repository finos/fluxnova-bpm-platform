      sql_table: ACT_HI_OP_LOG

  FluxnovaVariableInstance:
    description: A VariableInstance represents a variable in the execution of a process instance.
    slots:
      - id
      - type
      - name
      - execution_id
      - process_instance_id
      - process_definition_id
      - case_execution_id
      - case_instance_id
      - task_id
      - batch_id
      - byte_array_id
      - double_value
      - long_value
      - text_value
      - text2_value
      - variable_scope_id
      - sequence_counter
      - is_concurrent_local
      - tenant_id
      - restricted
    slot_usage:
      type:
        required: true
      name:
        required: true
      execution_id:
        range: FluxnovaExecution
      process_instance_id:
        range: FluxnovaExecution
      case_execution_id:
        range: FluxnovaCaseExecution
      case_instance_id:
        range: FluxnovaCaseExecution
      batch_id:
        range: FluxnovaBatch
      byte_array_id:
