        ifabsent: int(0)
        required: true
        description: Priority of the associated external task when this log entry was created.
      external_task_id:
        required: true
        description: Id of the associated external task.
      id:
        description: Unique identifier for this historic external task log.
      tenant_id:
        description: Id of the tenant this external task log entry belongs to.
      removal_time:
        description: The time the historic external task log will be removed.
      root_process_instance_id:
        description: Specific root process instance id of the process instance on which the
          associated external task was created.
      process_instance_id:
        description: Specific process instance id on which the associated external task was
          created.
      process_definition_id:
        description: Specific process definition id on which the associated external task
          was created.
      process_definition_key:
        description: Specific process definition key on which the associated external task
          was created.
