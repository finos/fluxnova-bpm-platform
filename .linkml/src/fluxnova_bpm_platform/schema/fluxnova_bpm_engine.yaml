      - engine_identity
    annotations:
      sql_table: ACT_ID_USER

  FluxnovaUserOperationLogEntry:
    description: Log entry about an operation performed by a user.
    slots:
      - id
      - deployment_id
      - process_definition_id
      - process_definition_key
      - root_process_instance_id
      - process_instance_id
      - execution_id
      - case_definition_id
      - case_instance_id
      - case_execution_id
      - task_id
      - job_id
      - job_definition_id
      - batch_id
      - user_id
      - timestamp
      - operation_type
      - operation_id
      - entity_type
      - property
      - original_value
      - new_value
      - tenant_id
      - removal_time
      - category
      - external_task_id
      - annotation
