see_also:
  - https://lmodel.github.io/fluxnova-bpm-platform

prefixes:
  fluxnova_bpm_platform: https://w3id.org/lmodel/fluxnova-bpm-platform/
  linkml: https://w3id.org/linkml/
default_prefix: fluxnova_bpm_platform
default_range: string

imports:
  - linkml:types

subsets:
  engine_base:
    description: 'The general tables: stored bytes, properties, the schema log and the metrics
      logs.'

  engine_repository:
    description: 'The repository tables: deployments and the process, case, decision and form
      definitions in them.'

  engine_runtime:
    description: 'The runtime tables: executions, tasks, variables, event subscriptions, incidents
      and external tasks.'

  engine_job:
    description: 'The job tables: jobs, their definitions and batches.'

  engine_identity:
    description: 'The identity tables: users, groups, tenants, their memberships and authorizations.'

  engine_history:
    description: 'The history tables: what process, case and decision instances did, kept
      after they end.'

  engine_collaboration:
    description: 'The tables of what people add to tasks and process instances: comments,
      attachments and filters.'

enums:
  HistoricProcessInstanceState:
    description: The state a historic process instance records.
    comments:
      - Values from engine/history/HistoricProcessInstance.java.
    permissible_values:
      ACTIVE:
        description: The process instance is running.
      SUSPENDED:
        description: The process instance is suspended.
      COMPLETED:
        description: The process instance reached an end event.
      EXTERNALLY_TERMINATED:
        description: The process instance was ended from outside, such as through the REST
          API.
      INTERNALLY_TERMINATED:
        description: The process instance was ended from within, such as by a terminate end
          event.

  HistoricVariableInstanceState:
    description: Whether a historic variable instance still exists.
    comments:
      - Values from engine/history/HistoricVariableInstance.java.
    permissible_values:
      CREATED:
        description: The variable exists.
      DELETED:
        description: The variable was deleted.

  ConfigurationStatus:
    description: Whether a configuration entry is in effect.
    comments:
      - Values from engine/configuration/Configuration.java.
    permissible_values:
      ACTIVE:
        description: The entry is in effect.
      INACTIVE:
        description: A newer version of the entry replaced it.
      DELETED:
        description: The entry was deleted, and is kept.

  DelegationState:
    description: Where a delegated task stands.
    comments:
      - Values from engine/task/DelegationState.java.
    permissible_values:
      PENDING:
        description: The task was delegated and waits for the delegate to resolve it.
      RESOLVED:
        description: The delegate resolved the task and handed it back to its owner.

