  FluxnovaHistoricProcessInstance:
    description: A single execution of a whole process definition that is stored permanently.
    is_a: FluxnovaHistoricScopeInstance
    slots:
      - process_instance_id
      - business_key
      - process_definition_key
      - process_definition_id
      - start_time
      - end_time
      - removal_time
      - start_user_id
      - start_activity_id
      - end_activity_id
      - super_process_instance_id
      - root_process_instance_id
      - super_case_instance_id
      - case_instance_id
      - delete_reason
      - state
      - restarted_process_instance_id
    slot_usage:
      process_instance_id:
        required: true
      process_definition_id:
        required: true
        description: The process definition reference.
      start_time:
        required: true
        description: The time the process was started.
      state:
        range: HistoricProcessInstanceState
        description: 'Current state of HistoricProcessInstance, following values are recognized
          during process engine operations: STATE_ACTIVE - running process instance STATE_SUSPENDED
          - suspended process instances STATE_COMPLETED - completed through normal end event
          STATE_EXTERNALLY_TERMINATED - terminated externally, for instance through REST API
          STATE_INTERNALLY_TERMINATED - terminated internally, for instance by terminating
          boundary event.'
      id:
        description: The process instance id (== as the id for the runtime process instance).
      tenant_id:
        description: The id of the tenant this historic process instance belongs to.
      removal_time:
        description: The time the historic process instance will be removed.
      root_process_instance_id:
        description: The process instance id of the top-level (root) process instance or null
          if no root process instance exists.
      process_definition_key:
        description: The process definition key reference.
      end_time:
        description: The time the process was ended.
      case_instance_id:
        description: The case instance id of a potential super case instance or null if no
          super case instance exists.
      business_key:
        description: The user provided unique reference to this process instance.
      delete_reason:
        description: Obtains the reason for the process instance's deletion.
    unique_keys:
      historicprocessinstance_process_instance_id:
        description: A unique constraint of the table's DDL.
        unique_key_slots:
          - process_instance_id
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_PROCINST

