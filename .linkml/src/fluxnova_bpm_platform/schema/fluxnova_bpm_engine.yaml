        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
      deployment_id:
        description: The id of the deployment this job definition is related to.
      tenant_id:
        description: The id of the tenant this job definition belongs to.
      activity_id:
        description: The Id of the activity (from BPMN 2.0 Xml) this Job Definition is associated
          with.
    in_subset:
      - engine_job
    annotations:
      sql_table: ACT_RU_JOBDEF

  FluxnovaMembership:
    description: Association entity in identity and access management.
    slots:
      - user_id
      - group_id
    slot_usage:
      user_id:
        required: true
        range: FluxnovaUser
      group_id:
        required: true
        range: FluxnovaGroup
    unique_keys:
      membership_pk:
        description: The table's primary key.
        unique_key_slots:
          - user_id
          - group_id
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_ID_MEMBERSHIP

  FluxnovaMeterLog:
    description: Meter Log entity in the engine infrastructure.
    slots:
      - id
      - name
      - reporter
      - value
      - timestamp
      - milliseconds
    slot_usage:
      name:
        required: true
      value:
        range: integer
      milliseconds:
        ifabsent: int(0)
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_RU_METER_LOG

  FluxnovaProcessDefinition:
    description: An object structure representing an executable process composed of activities
      and transitions.
    is_a: FluxnovaResourceDefinition
    slots:
      - category
      - name
      - diagram_resource_name
      - has_start_form_key
      - suspension_state
      - version_tag
      - history_time_to_live
      - is_startable
    slot_usage:
      key:
        required: true
      version:
        required: true
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
      is_startable:
        ifabsent: 'true'
      name:
        description: Label used for display purposes.
      category:
        description: Category name which is derived from the targetNamespace attribute in
          the definitions element.
      version_tag:
        description: Version tag of the process definition.
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_PROCDEF

  FluxnovaEngineProperty:
    description: Property entity in the engine infrastructure.
    slots:
      - name
      - value
    slot_usage:
      name:
        identifier: true
        required: true
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_GE_PROPERTY

  FluxnovaResourceDefinition:
    description: Abstract base of the process, case, decision, decision requirements and form
      definitions, with the columns all five tables have.
    abstract: true
    slots:
      - id
      - key
      - version
      - deployment_id
      - resource_name
      - tenant_id
    slot_usage:
      key:
        description: Unique name for all versions this definition.
      version:
        description: Version of this definition.
      deployment_id:
        description: The deployment in which this definition is contained.
      tenant_id:
        description: The id of the tenant this definition belongs to.
    in_subset:
      - engine_repository

  FluxnovaSchemaLogEntry:
    description: Schema Log Entry entity in the engine infrastructure.
    slots:
      - id
      - timestamp
      - version
    slot_usage:
      version:
        range: string
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_GE_SCHEMA_LOG

  FluxnovaTask:
    description: Represents one task for a human user.
    slots:
      - id
      - execution_id
      - process_instance_id
      - process_definition_id
      - case_execution_id
      - case_instance_id
      - case_definition_id
      - name
      - parent_task_id
      - description
      - task_definition_key
      - owner
      - assignee
      - delegation_state
      - priority
      - create_time
      - last_updated
      - due_date
      - follow_up_date
      - suspension_state
      - tenant_id
      - task_state
    slot_usage:
      execution_id:
        range: FluxnovaExecution
        description: Reference to the path of execution or null if it is not related to a
          process instance.
      process_instance_id:
        range: FluxnovaExecution
        description: Reference to the process instance or null if it is not related to a process
          instance.
      process_definition_id:
        range: FluxnovaProcessDefinition
        description: Reference to the process definition or null if it is not related to a
          process.
      case_execution_id:
        range: FluxnovaCaseExecution
        description: Reference to the path of case execution or null if it is not related
          to a case instance.
      case_definition_id:
        range: FluxnovaCaseDefinition
        description: Reference to the case definition or null if it is not related to a case.
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
      id:
        description: DB id of the task.
      name:
        description: Name or title of the task.
      description:
        description: Free text description of the task.
      tenant_id:
        description: Task's tenant id or null in case this task does not belong to a tenant.
      create_time:
        description: The date/time when this task was created.
      case_instance_id:
        description: Reference to the case instance or null if it is not related to a case
          instance.
      assignee:
        description: The userId of the person to which this task is assigned or delegated.
      priority:
        description: 'Indication of how important/urgent this task is with a number between
          0 and 100 where higher values mean a higher priority and lower values mean lower
          priority: [0..19] lowest, [20..39] low, [40..59] normal, [60..79] high [80..100]
          highest.'
      task_definition_key:
        description: The id of the activity in the process defining this task or null if this
          is not related to a process.
      parent_task_id:
        description: The parent task for which this task is a subtask.
      owner:
        description: The userId of the person that is responsible for this task.
      due_date:
        description: Due date of the task.
      follow_up_date:
        description: Follow-up date of the task.
      task_state:
        description: Task's state.
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_TASK

  FluxnovaTaskMeterLog:
    description: Task Meter Log entity in the engine infrastructure.
    slots:
      - id
      - assignee_hash
      - timestamp
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_RU_TASK_METER_LOG

  FluxnovaTenant:
    description: Represents a tenant, used in IdentityService.
    slots:
      - id
      - name
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_ID_TENANT

  FluxnovaTenantMembership:
    description: Association entity in identity and access management.
    slots:
      - id
      - tenant_id
      - user_id
      - group_id
    slot_usage:
      tenant_id:
        required: true
        range: FluxnovaTenant
      user_id:
        range: FluxnovaUser
      group_id:
        range: FluxnovaGroup
    unique_keys:
      act_uniq_tenant_memb_user:
        description: The DDL's constraint ACT_UNIQ_TENANT_MEMB_USER.
        unique_key_slots:
          - tenant_id
          - user_id
        consider_nulls_inequal: true
      act_uniq_tenant_memb_group:
        description: The DDL's constraint ACT_UNIQ_TENANT_MEMB_GROUP.
        unique_key_slots:
          - tenant_id
          - group_id
        consider_nulls_inequal: true
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_ID_TENANT_MEMBER

  FluxnovaUser:
    description: Represents a user, used in IdentityService.
    slots:
      - id
      - first_name
      - last_name
      - email
      - password
      - salt
      - lock_expiration_time
      - attempts
      - picture_id
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_ID_USER

  FluxnovaUserOperationLogEntry:
    description: Log entry about an operation performed by a user.
    slots:
      - id
      - deployment_id
      - process_definition_id
      - process_definition_key
      - root_process_instance_id
      - process_instance_id
      - execution_id
      - case_definition_id
      - case_instance_id
      - case_execution_id
      - task_id
      - job_id
      - job_definition_id
      - batch_id
      - user_id
      - timestamp
      - operation_type
      - operation_id
      - entity_type
      - property
      - original_value
      - new_value
      - tenant_id
      - removal_time
      - category
      - external_task_id
      - annotation
    slot_usage:
      timestamp:
        required: true
        description: Timestamp of this change.
      id:
        description: The unique identifier of this log entry.
      category:
        description: The category this entry is associated with.
      deployment_id:
        description: Deployment reference.
      tenant_id:
        description: The id of the tenant this user operation log belongs to.
      removal_time:
        description: The time the historic user operation log will be removed.
      root_process_instance_id:
        description: Root process instance reference.
      process_instance_id:
        description: Process instance reference.
      process_definition_id:
        description: Process definition reference.
      process_definition_key:
        description: Key of the process definition this log entry belongs to; null means any.
      execution_id:
        description: Execution reference.
      task_id:
        description: Task instance reference.
      case_definition_id:
        description: Case definition reference.
      case_instance_id:
        description: Case instance reference.
      case_execution_id:
        description: Case execution reference.
      user_id:
        description: The User who performed the operation.
      batch_id:
        description: Batch reference.
      job_definition_id:
        description: Job definition reference.
      operation_id:
        description: The unique identifier of this operation.
      external_task_id:
        description: External task reference.
      operation_type:
        description: Type of this operation, like create, assign, claim and so on.
      annotation:
        description: An arbitrary annotation set by a user for auditing reasons.
      job_id:
        description: Job instance reference.
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_OP_LOG

  FluxnovaVariableInstance:
    description: A VariableInstance represents a variable in the execution of a process instance.
    slots:
      - id
      - type
      - name
      - execution_id
      - process_instance_id
      - process_definition_id
      - case_execution_id
      - case_instance_id
      - task_id
      - batch_id
      - byte_array_id
      - double_value
      - long_value
      - text_value
      - text2_value
      - variable_scope_id
      - sequence_counter
      - is_concurrent_local
      - tenant_id
      - restricted
    slot_usage:
      type:
        required: true
      name:
        required: true
        description: Name of this variable instance.
      execution_id:
        range: FluxnovaExecution
        description: Corresponding execution id.
      process_instance_id:
        range: FluxnovaExecution
        description: Corresponding process instance id.
      case_execution_id:
        range: FluxnovaCaseExecution
        description: Corresponding case execution id.
      case_instance_id:
        range: FluxnovaCaseExecution
        description: Corresponding case instance id.
      batch_id:
        range: FluxnovaBatch
        description: Corresponding batch id.
      byte_array_id:
        range: FluxnovaByteArray
      tenant_id:
        description: The id of the tenant this variable belongs to.
      process_definition_id:
        description: Corresponding process definition id.
      task_id:
        description: Corresponding task id.
    unique_keys:
      act_uniq_variable:
        description: The DDL's constraint ACT_UNIQ_VARIABLE.
        unique_key_slots:
          - variable_scope_id
          - name
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_VARIABLE
