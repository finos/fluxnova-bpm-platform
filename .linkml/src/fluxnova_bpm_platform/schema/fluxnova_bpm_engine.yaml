  super_case_instance_id:
    range: string
    description: The case instance id of a potential super case instance or null if no super
      case instance exists.
    annotations:
      sql_column: SUPER_CASE_INSTANCE_ID_

  super_execution_id:
    range: string
    description: Reference to the super execution.
    annotations:
      sql_column: SUPER_EXEC_

  super_process_instance_id:
    range: string
    description: The process instance id of a potential super process instance or null if
      no super process instance exists.
    annotations:
      sql_column: SUPER_PROCESS_INSTANCE_ID_

  suspension_state:
    range: integer
    description: Whether the entity is active or suspended.
    annotations:
      sql_column: SUSPENSION_STATE_

  task_definition_key:
    range: string
    description: The task definition key.
    annotations:
      sql_column: TASK_DEF_KEY_

  task_id:
    range: string
    description: Reference to the task.

  task_state:
    range: string
    description: The task state.
    annotations:
      sql_column: TASK_STATE_

  tenant_id:
    range: string
    description: Multi-tenancy discriminator.

  text2_value:
    range: string
    description: Variable value stored as text2.
    annotations:
      sql_column: TEXT2_

  text_value:
    range: string
    description: Variable value stored as text.
    annotations:
      sql_column: TEXT_

  timestamp:
    range: datetime
    description: Timestamp for timestamp.
    annotations:
      sql_column: TIMESTAMP_

  topic_name:
    range: string
    description: Topic name for external task subscription.
    annotations:
      sql_column: TOPIC_NAME_

  total_jobs:
    range: integer
    description: Total number of jobs.
    annotations:
      sql_column: TOTAL_JOBS_

  type:
    range: string
    description: Type discriminator.

  updated_at:
    range: datetime
    description: Timestamp for updated at.
    annotations:
      sql_column: UPDATED_AT_

  updated_by:
    range: string
    description: The updated by.
    annotations:
      sql_column: UPDATED_BY_

  url:
    range: string
    description: The remote URL in case this is remote content.
    annotations:
      sql_column: URL_

  user_id:
    range: string
    description: Reference to a user.

  value:
    range: string
    description: The row's value.
    annotations:
      sql_column: VALUE_

  variable_event:
    range: string
    description: The variable event.
    annotations:
      sql_column: VARIABLE_EVENT_

  variable_instance_id:
    range: string
    description: Reference to the variable instance.
    annotations:
      sql_column: VAR_INST_ID_

  variable_name:
    range: string
    description: The variable name.
    annotations:
      sql_column: VAR_NAME_

  variable_scope_id:
    range: string
    required: true
    description: Reference to the variable scope.
    annotations:
      sql_column: VAR_SCOPE_

  variable_type:
    range: string
    description: The variable type.
    annotations:
      sql_column: VAR_TYPE_

  version:
    range: integer
    description: Version number.

  version_tag:
    range: string
    description: User-defined version tag.
    annotations:
      sql_column: VERSION_TAG_

  worker_id:
    range: string
    description: Reference to the worker.
    annotations:
      sql_column: WORKER_ID_

classes:
  FluxnovaAttachment:
    description: Any type of content that is be associated with a task or with a process instance.
    slots:
      - id
      - user_id
      - name
      - description
      - type
      - task_id
      - root_process_instance_id
      - process_instance_id
      - url
      - content_id
      - tenant_id
      - create_time
      - removal_time
      - created_by
    slot_usage:
      id:
        description: Unique id for this attachment.
      name:
        description: Free user defined short (max 255 chars) name for this attachment.
      description:
        description: Long (max 255 chars) explanation what this attachment is about in context
          of the task and/or process instance it's linked to.
      removal_time:
        description: The time the historic attachment will be removed.
      root_process_instance_id:
        description: Reference to the root process instance id of the process instance on
          which this attachment was made.
      process_instance_id:
        description: Reference to the process instance to which this attachment is associated.
      create_time:
        description: The time when the attachment was created.
      task_id:
        description: Reference to the task to which this attachment is associated.
      type:
        description: Indication of the type of content that this attachment refers to.
      created_by:
        description: The user who created this attachment.
    in_subset:
      - engine_collaboration
    annotations:
      sql_table: ACT_HI_ATTACHMENT

  FluxnovaAuthorization:
    description: An Authorization assigns a set of Permissions to an identity to interact
      with a given Resource.
    slots:
      - id
      - type
      - group_id
      - user_id
      - resource_type
      - resource_id
      - permissions
      - removal_time
      - root_process_instance_id
    slot_usage:
      type:
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 2
        comments:
          - 'Codes, from engine/authorization/Authorization.java: 0 global, 1 grant, 2 revoke.'
      removal_time:
        description: The removal time indicates the date a historic instance authorization
          is cleaned up A removal time can only be assigned to a historic instance authorization.
      root_process_instance_id:
        description: The process instance id of the top-level (root) process instance the
          historic instance authorization is related to A root process instance id is only
          assigned to a historic instance authorization.
    unique_keys:
      act_uniq_auth_user:
        description: The DDL's constraint ACT_UNIQ_AUTH_USER.
        unique_key_slots:
          - type
          - user_id
          - resource_type
          - resource_id
        consider_nulls_inequal: true
      act_uniq_auth_group:
        description: The DDL's constraint ACT_UNIQ_AUTH_GROUP.
        unique_key_slots:
          - type
          - group_id
          - resource_type
          - resource_id
        consider_nulls_inequal: true
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_RU_AUTHORIZATION

  FluxnovaBatch:
    description: A batch represents a number of jobs which execute a number of commands asynchronously.
    slots:
      - id
      - type
      - total_jobs
      - jobs_created
      - jobs_per_seed
      - invocations_per_job
      - seed_job_definition_id
      - batch_job_definition_id
      - monitor_job_definition_id
      - suspension_state
      - configuration
      - tenant_id
      - create_user_id
      - start_time
      - execution_start_time
    slot_usage:
      seed_job_definition_id:
        range: FluxnovaJobDefinition
      batch_job_definition_id:
        range: FluxnovaJobDefinition
      monitor_job_definition_id:
        range: FluxnovaJobDefinition
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
    in_subset:
      - engine_job
    annotations:
      sql_table: ACT_RU_BATCH

  FluxnovaByteArray:
    description: Byte Array entity in the engine infrastructure.
    slots:
      - id
      - name
      - deployment_id
      - bytes
      - is_generated
      - tenant_id
      - type
      - create_time
      - root_process_instance_id
      - removal_time
    slot_usage:
      type:
        range: integer
      deployment_id:
        range: FluxnovaDeployment
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_GE_BYTEARRAY

  FluxnovaCaseDefinition:
    description: A deployed case definition in the process repository.
    is_a: FluxnovaResourceDefinition
    slots:
      - category
      - name
      - diagram_resource_name
      - history_time_to_live
    slot_usage:
      key:
        required: true
      version:
        required: true
      name:
        description: Label used for display purposes.
      category:
        description: Category name which is derived from the targetNamespace attribute in
          the definitions element.
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_CASE_DEF

  FluxnovaCaseExecution:
    description: Case Execution entity in the process execution runtime.
    slots:
      - id
      - case_instance_id
      - super_case_execution_id
      - super_execution_id
      - business_key
      - parent_id
      - case_definition_id
      - activity_id
      - previous_state
      - current_state
      - is_required
      - tenant_id
    slot_usage:
      case_instance_id:
        range: FluxnovaCaseExecution
      parent_id:
        range: FluxnovaCaseExecution
      case_definition_id:
        range: FluxnovaCaseDefinition
      previous_state:
        minimum_value: 0
        maximum_value: 14
        comments:
          - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available,
            2 enabled, 3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed,
            9 closed, 10 terminating on termination, 11 terminating on parent termination,
            12 terminating on exit, 13 suspending on suspension, 14 suspending on parent suspension.'
      current_state:
        minimum_value: 0
        maximum_value: 14
        comments:
          - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available,
            2 enabled, 3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed,
            9 closed, 10 terminating on termination, 11 terminating on parent termination,
            12 terminating on exit, 13 suspending on suspension, 14 suspending on parent suspension.'
      tenant_id:
        description: The id of the tenant this case execution belongs to.
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_CASE_EXECUTION

  FluxnovaCaseSentryPart:
    description: Case Sentry Part entity in the process execution runtime.
    slots:
      - id
      - case_instance_id
      - case_execution_id
      - sentry_id
      - type
      - source_case_execution_id
      - standard_event
      - source
      - variable_event
      - variable_name
      - is_satisfied
      - tenant_id
    slot_usage:
      case_instance_id:
        range: FluxnovaCaseExecution
      case_execution_id:
        range: FluxnovaCaseExecution
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_CASE_SENTRY_PART

  FluxnovaComment:
    description: User comments that form discussions around tasks.
    slots:
      - id
      - type
      - event_time
      - user_id
      - task_id
      - root_process_instance_id
      - process_instance_id
      - action
      - message
      - full_message
      - tenant_id
      - removal_time
    slot_usage:
      id:
        description: Comment id.
      removal_time:
        description: The time the historic comment will be removed.
      root_process_instance_id:
        description: Reference to the root process instance id of the process instance on
          which this comment was made.
      process_instance_id:
        description: Reference to the process instance on which this comment was made.
      task_id:
        description: Reference to the task on which this comment was made.
      user_id:
        description: Reference to the user that made the comment.
    in_subset:
      - engine_collaboration
    annotations:
      sql_table: ACT_HI_COMMENT

  FluxnovaConfiguration:
    description: 'A process configuration entry: a key/value pair which is either global or
      scoped to a single tenant.'
    slots:
      - id
      - configuration_key
      - tenant_id
      - configuration_value
      - version
      - status
      - created_by
      - created_at
      - updated_by
      - updated_at
    slot_usage:
      version:
        required: true
        ifabsent: int(1)
      status:
        ifabsent: ConfigurationStatus(ACTIVE)
    in_subset:
      - engine_base
    annotations:
      sql_table: ACT_GE_CONFIGURATION

  FluxnovaDecisionDefinition:
    description: Definition of a decision resource.
    is_a: FluxnovaResourceDefinition
    slots:
      - category
      - name
      - diagram_resource_name
      - decision_requirements_definition_id
      - decision_requirements_definition_key
      - history_time_to_live
      - version_tag
    slot_usage:
      key:
        required: true
      version:
        required: true
      decision_requirements_definition_id:
        range: FluxnovaDecisionRequirementsDefinition
        description: Id of the related decision requirements definition.
      name:
        description: Label used for display purposes.
      category:
        description: Category name which is derived from the targetNamespace attribute in
          the definitions element.
      decision_requirements_definition_key:
        description: Key of the related decision requirements definition.
      version_tag:
        description: Version tag of the decision definition.
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_DECISION_DEF

  FluxnovaDecisionRequirementsDefinition:
    description: Container of DecisionDefinitions which belongs to the same decision requirements
      graph (i.e. DMN resource).
    is_a: FluxnovaResourceDefinition
    slots:
      - category
      - name
      - diagram_resource_name
    slot_usage:
      key:
        required: true
      version:
        required: true
      name:
        description: Label used for display purposes.
      category:
        description: Category name which is derived from the targetNamespace attribute in
          the definitions element.
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_DECISION_REQ_DEF

  FluxnovaDeployment:
    description: Represents a deployment that is already present in the process repository.
    slots:
      - id
      - name
      - deploy_time
      - source
      - tenant_id
    slot_usage:
      tenant_id:
        description: Id of the tenant this deployment belongs to.
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_DEPLOYMENT

  FluxnovaEventSubscription:
    description: A message event subscription exists, if an Execution waits for an event like
      a message.
    slots:
      - id
      - event_type
      - event_name
      - execution_id
      - process_instance_id
      - activity_id
      - configuration
      - created
      - tenant_id
    slot_usage:
      execution_id:
        range: FluxnovaExecution
        description: The execution that is subscribed on the referenced event.
      id:
        description: The unique identifier of the event subscription.
      tenant_id:
        description: The id of the tenant this event subscription belongs to.
      process_instance_id:
        description: The process instance this subscription belongs to.
      activity_id:
        description: The identifier of the activity that this event subscription belongs to.
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_EVENT_SUBSCR

  FluxnovaExecution:
    description: Represent a 'path of execution' in a process instance.
    slots:
      - id
      - root_process_instance_id
      - process_instance_id
      - business_key
      - parent_id
      - process_definition_id
      - super_execution_id
      - super_case_execution_id
      - case_instance_id
      - activity_instance_id
      - activity_id
      - is_active
      - is_concurrent
      - is_scope
      - is_event_scope
      - suspension_state
      - cached_entity_state
      - sequence_counter
      - tenant_id
      - process_definition_key
    slot_usage:
      process_instance_id:
        range: FluxnovaExecution
        description: Id of the root of the execution tree representing the process instance.
      parent_id:
        range: FluxnovaExecution
      process_definition_id:
        range: FluxnovaProcessDefinition
      super_execution_id:
        range: FluxnovaExecution
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
      id:
        description: The unique identifier of the execution.
      tenant_id:
        description: The id of the tenant this execution belongs to.
      process_definition_key:
        description: The Key of the process definition.
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_EXECUTION

  FluxnovaExternalTask:
    description: Represents an instance of an external task that is created when a service-task
      like activity (i.e. service task, send task, ...) with attribute camunda:type="external"
      is executed.
    slots:
      - id
      - worker_id
      - topic_name
      - retries
      - error_message
      - error_details_id
      - lock_expiration_time
      - create_time
      - suspension_state
      - execution_id
      - process_instance_id
      - process_definition_id
      - process_definition_key
      - activity_id
      - activity_instance_id
      - tenant_id
      - priority
      - last_failure_log_id
    slot_usage:
      error_details_id:
        range: FluxnovaByteArray
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
          - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2
            suspended.'
      execution_id:
        range: FluxnovaExecution
      priority:
        ifabsent: int(0)
        required: true
        description: Priority of the external task.
    in_subset:
      - engine_runtime
    annotations:
      sql_table: ACT_RU_EXT_TASK

  FluxnovaFilter:
    description: Filter entity in the user collaboration.
    slots:
      - id
      - resource_type
      - name
      - owner
      - query
      - properties
    slot_usage:
      resource_type:
        range: string
      name:
        required: true
    in_subset:
      - engine_collaboration
    annotations:
      sql_table: ACT_RU_FILTER

  FluxnovaFormDefinition:
    description: An object structure representing a Camunda Form used to present forms to
      users either when starting a process instance or when assigned to a User Task.
    is_a: FluxnovaResourceDefinition
    slot_usage:
      key:
        required: true
      version:
        required: true
    in_subset:
      - engine_repository
    annotations:
      sql_table: ACT_RE_CAMFORMDEF

  FluxnovaGroup:
    description: Represents a group, used in IdentityService.
    slots:
      - id
      - name
      - type
    in_subset:
      - engine_identity
    annotations:
      sql_table: ACT_ID_GROUP

  FluxnovaHistoricActivityInstance:
    description: Represents one execution of an activity and it's stored permanent for statistics,
      audit and other business intelligence purposes.
    is_a: FluxnovaHistoricScopeInstance
    slots:
      - parent_activity_instance_id
      - process_definition_key
      - process_definition_id
      - root_process_instance_id
      - process_instance_id
      - execution_id
      - activity_id
      - task_id
      - called_process_instance_id
      - called_case_instance_id
      - activity_name
      - activity_type
      - assignee
      - start_time
      - end_time
      - activity_instance_state
      - sequence_counter
      - removal_time
    slot_usage:
      process_definition_id:
        required: true
        description: Process definition reference.
      process_instance_id:
        required: true
        description: Process instance reference.
      execution_id:
        required: true
        description: Execution reference.
      activity_id:
        required: true
        description: The unique identifier of the activity in the process.
      start_time:
        required: true
        description: Time when the activity instance started.
      activity_instance_state:
        minimum_value: 0
        maximum_value: 4
        comments:
          - 'Codes, from engine/impl/pvm/runtime/ActivityInstanceState.java: 0 default, 1
            scope complete, 2 canceled, 3 starting, 4 ending.'
      id:
        description: The unique identifier of this historic activity instance.
      tenant_id:
        description: The id of the tenant this historic activity instance belongs to.
      removal_time:
        description: The time the historic activity instance will be removed.
      root_process_instance_id:
        description: Root process instance reference.
      process_definition_key:
        description: Process definition key reference.
      end_time:
        description: Time when the activity instance ended.
      task_id:
        description: The corresponding task in case of task activity.
      parent_activity_instance_id:
        description: Id of the parent activity instance.
      called_process_instance_id:
        description: The called process instance in case of call activity.
      called_case_instance_id:
        description: The called case instance in case of (case) call activity.
      assignee:
        description: Assignee in case of user task activity.
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_ACTINST

  FluxnovaHistoricBatch:
    description: Historic representation of a Batch.
    slots:
      - id
      - type
      - total_jobs
      - jobs_per_seed
      - invocations_per_job
      - seed_job_definition_id
      - monitor_job_definition_id
      - batch_job_definition_id
      - tenant_id
      - create_user_id
      - start_time
      - end_time
      - removal_time
      - execution_start_time
    slot_usage:
      start_time:
        required: true
      removal_time:
        description: The time the historic batch will be removed.
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_BATCH

  FluxnovaHistoricCaseActivityInstance:
    description: Represents one execution of a case activity which is stored permanent for
      statistics, audit and other business intelligence purposes.
    is_a: FluxnovaHistoricScopeInstance
    slots:
      - parent_activity_instance_id
      - case_definition_id
      - case_instance_id
      - case_activity_id
      - task_id
      - called_process_instance_id
      - called_case_instance_id
      - case_activity_name
      - case_activity_type
      - create_time
      - end_time
      - state
      - is_required
    slot_usage:
      case_definition_id:
        required: true
        description: The case definition reference.
      case_instance_id:
        required: true
        description: The case instance reference.
      create_time:
        required: true
        description: The time when the case activity was created.
      state:
        minimum_value: 0
        maximum_value: 14
        comments:
          - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available,
            2 enabled, 3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed,
            9 closed, 10 terminating on termination, 11 terminating on parent termination,
            12 terminating on exit, 13 suspending on suspension, 14 suspending on parent suspension.'
      id:
        description: The id of the case activity instance (== as the id of the runtime activity).
      tenant_id:
        description: The id of the tenant this historic case activity instance belongs to.
      end_time:
        description: The time when the case activity ended.
      task_id:
        description: The corresponding task in case of a human task activity.
      called_process_instance_id:
        description: The corresponding process in case of a process task activity.
      called_case_instance_id:
        description: The corresponding case in case of a case task activity.
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_CASEACTINST

  FluxnovaHistoricCaseInstance:
    description: A single execution of a case definition that is stored permanently.
    is_a: FluxnovaHistoricScopeInstance
    slots:
      - case_instance_id
      - business_key
      - case_definition_id
      - create_time
      - close_time
      - state
      - create_user_id
      - super_case_instance_id
      - super_process_instance_id
    slot_usage:
      case_instance_id:
        required: true
      case_definition_id:
        required: true
        description: The case definition reference.
      create_time:
        required: true
        description: The time the case was created.
      state:
        minimum_value: 0
        maximum_value: 14
        comments:
          - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available,
            2 enabled, 3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed,
            9 closed, 10 terminating on termination, 11 terminating on parent termination,
            12 terminating on exit, 13 suspending on suspension, 14 suspending on parent suspension.'
      id:
        description: The case instance id (== as the id of the runtime CaseInstance).
      tenant_id:
        description: The id of the tenant this historic case instance belongs to.
      business_key:
        description: The user provided unique reference to this process instance.
      create_user_id:
        description: The authenticated user that created this case instance.
    unique_keys:
      historiccaseinstance_case_instance_id:
        description: A unique constraint of the table's DDL.
        unique_key_slots:
          - case_instance_id
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_CASEINST

  FluxnovaHistoricDecisionInputInstance:
    description: Represents one input variable of a decision evaluation.
    slots:
      - id
      - decision_instance_id
      - clause_id
      - clause_name
      - variable_type
      - byte_array_id
      - double_value
      - long_value
      - text_value
      - text2_value
      - tenant_id
      - create_time
      - root_process_instance_id
      - removal_time
    slot_usage:
      id:
        description: The unique identifier of this historic decision input instance.
      removal_time:
        description: The time the historic decision instance will be removed.
      root_process_instance_id:
        description: Root process instance id of the process instance on which the associated
          business rule task has been called.
      create_time:
        description: Time when the variable was created.
    in_subset:
      - engine_history
    annotations:
      sql_table: ACT_HI_DEC_IN

  FluxnovaHistoricDecisionInstance:
    description: Represents one evaluation of a decision.
    slots:
      - id
      - decision_definition_id
      - decision_definition_key
      - decision_definition_name
      - process_definition_key
