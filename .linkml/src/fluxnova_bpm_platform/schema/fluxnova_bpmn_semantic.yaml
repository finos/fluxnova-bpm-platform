---
# Written by scripts/bpmn_to_linkml.py from FINOS's tree; edit the script, not this file.
id: https://w3id.org/lmodel/fluxnova-bpm-platform/fluxnova_bpmn_semantic
name: fluxnova_bpmn_semantic
title: Fluxnova BPMN semantic elements
description: The BPMN 2.0 elements of a process, collaboration or definitions document.
version: 3.1.1
source: https://github.com/finos/fluxnova-bpm-platform/tree/3ac64ca2c3d7c93f00395e18b9dc3218e5250264/model-api/bpmn-model/src/main
license: Apache-2.0
see_also:
  - https://lmodel.github.io/fluxnova-bpm-platform

prefixes:
  fluxnova_bpm_platform: https://w3id.org/lmodel/fluxnova-bpm-platform/
  linkml: https://w3id.org/linkml/
  bpmn: http://www.omg.org/spec/BPMN/20100524/MODEL#
default_prefix: fluxnova_bpm_platform
default_range: string

imports:
  - linkml:types
  - fluxnova_bpmn_bpmndi

enums:
  BpmnAssociationDirection:
    description: Which ends of an association an arrow is drawn at.
    permissible_values:
      None:
        description: No arrow is drawn.
      One:
        description: An arrow points at the target.
      Both:
        description: Arrows point at both ends.

  BpmnEventBasedGatewayType:
    description: How an event-based gateway that starts a process waits for its events.
    permissible_values:
      Exclusive:
        description: The first event starts the instance, and the others are no longer waited
          for.
      Parallel:
        description: Each event starts an instance, or joins the one already started.

  BpmnGatewayDirection:
    description: Whether a gateway splits flows, joins them or does both.
    permissible_values:
      Unspecified:
        description: The model does not say.
      Converging:
        description: The gateway joins incoming flows into one.
      Diverging:
        description: The gateway splits one flow into several.
      Mixed:
        description: The gateway both joins and splits.

  BpmnItemKind:
    description: Whether an item is information or a physical thing.
    permissible_values:
      Information:
        description: The item is information.
      Physical:
        description: The item is a physical thing.

  BpmnMultiInstanceFlowCondition:
    description: When a multi-instance activity throws an event as its instances complete.
    permissible_values:
      None:
        description: An event is thrown for each instance that completes.
      One:
        description: An event is thrown when the first instance completes.
      All:
        description: No event is thrown.
      Complex:
        description: The complex behavior definitions decide which events are thrown.

  BpmnProcessType:
    description: Whether a process is private to its participant, public, or neither.
    permissible_values:
      None:
        description: The model does not say.
      Public:
        description: The process shows only what its participant exchanges with others.
      Private:
        description: The process is internal to its participant.

  BpmnRelationshipDirection:
    description: Which way a relationship points.
    permissible_values:
      None:
        description: It has no direction.
      Forward:
        description: From its sources to its targets.
      Backward:
        description: From its targets to its sources.
      Both:
        description: Both ways.

  BpmnTransactionMethod:
    description: How a transaction commits or cancels, by the three values BPMN keeps from
      BPMN 1.1.
    permissible_values:
      '##Compensate':
        description: The transaction is cancelled by compensation; the default.
        title: Compensate
      '##Image':
        description: The method BPMN 1.1 called image.
        title: Image
      '##Store':
        description: The method BPMN 1.1 called store.
        title: Store

classes:
  BpmnActivationCondition:
    description: The condition a complex gateway checks to decide when enough incoming flows
      have arrived to continue.
    is_a: BpmnExpression
    exact_mappings:
      - bpmn:activationCondition
    annotations:
      xml_name: activationCondition
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/ActivationConditionImpl.java
    in_subset:
      - bpmn_semantic

  BpmnActivity:
    description: Work a process performs, either a task or a sub-process.
    abstract: true
    is_a: BpmnFlowNode
    mixins:
      - BpmnInteractionNode
    exact_mappings:
      - bpmn:activity
    annotations:
      xml_name: activity
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/ActivityImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      is_for_compensation:
        description: Whether the activity runs only to compensate another.
        range: boolean
        ifabsent: 'false'
        annotations:
          xml_name: isForCompensation
      start_quantity:
        description: How many tokens must arrive before the activity starts.
        range: integer
        ifabsent: int(1)
        annotations:
          xml_name: startQuantity
      completion_quantity:
        description: How many tokens the activity sends on when it completes.
        range: integer
        ifabsent: int(1)
        annotations:
          xml_name: completionQuantity
      default:
        description: The id of the sequence flow taken when no other outgoing flow's condition
          holds.
        range: string
        annotations:
          xml_name: default
          refers_to: BpmnSequenceFlow
          reference_kind: id
      io_specification:
        description: The element's data inputs and outputs.
        range: BpmnIoSpecification
        inlined: true
        annotations:
          xml_name: ioSpecification
      properties:
        description: The element's properties.
        range: BpmnProperty
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: property
      data_input_associations:
        description: How data reaches the element's inputs.
        range: BpmnDataInputAssociation
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: dataInputAssociation
      data_output_associations:
        description: How data leaves the element's outputs.
        range: BpmnDataOutputAssociation
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: dataOutputAssociation
      resource_roles:
        description: The roles resources play in the element, such as its performers.
        range: BpmnResourceRole
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: resourceRole
      loop_characteristics:
        description: How the activity repeats.
        range: BpmnLoopCharacteristics
        inlined: true
        annotations:
          xml_name: loopCharacteristics

  BpmnAdHocSubProcess:
    description: A sub-process whose inner activities run in no fixed order, as its performers
      choose.
    is_a: BpmnSubProcess
    exact_mappings:
      - bpmn:adHocSubProcess
    annotations:
      xml_name: adHocSubProcess
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/AdHocSubProcessImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      ordering:
        description: Whether the inner activities run in parallel or one after another.
        range: string
        ifabsent: string(Parallel)
        annotations:
          xml_name: ordering
      cancel_remaining_instances:
        description: Whether the activities still running are cancelled once the completion
          condition holds.
        range: boolean
        ifabsent: 'true'
        annotations:
          xml_name: cancelRemainingInstances
      completion_condition:
        description: The condition that ends the activity early when it holds.
        range: BpmnCompletionCondition
        inlined: true
        annotations:
          xml_name: completionCondition

  BpmnArtifact:
    description: An element that adds information to a diagram without changing how the process
      runs.
    abstract: true
    is_a: BpmnBaseElement
    exact_mappings:
      - bpmn:artifact
    annotations:
      xml_name: artifact
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/ArtifactImpl.java
    in_subset:
      - bpmn_semantic

  BpmnAssignment:
    description: A copy of a value from one expression to another within a data association.
    is_a: BpmnBaseElement
    exact_mappings:
      - bpmn:assignment
    annotations:
      xml_name: assignment
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/AssignmentImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      from_expression:
        description: The expression the value is copied from.
        range: BpmnFrom
        inlined: true
        required: true
        annotations:
          xml_name: from
      to_expression:
        description: The expression the value is copied to.
        range: BpmnTo
        inlined: true
        required: true
        annotations:
          xml_name: to

  BpmnAssociation:
    description: A link between an artifact, such as a text annotation, and another element.
    is_a: BpmnArtifact
    exact_mappings:
      - bpmn:association
    annotations:
      xml_name: association
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/AssociationImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      source_ref:
        description: The id or QName of the element the connection starts at.
        range: string
        required: true
        annotations:
          xml_name: sourceRef
          refers_to: BpmnBaseElement
          reference_kind: qname
      target_ref:
        description: The id or QName of the element the connection ends at.
        range: string
        required: true
        annotations:
          xml_name: targetRef
          refers_to: BpmnBaseElement
          reference_kind: qname
      association_direction:
        description: Which ends of the association an arrow is drawn at.
        range: BpmnAssociationDirection
        ifabsent: BpmnAssociationDirection(None)
        annotations:
          xml_name: associationDirection

  BpmnAuditing:
    description: A hook for auditing a process or flow element, left to the implementation.
    is_a: BpmnBaseElement
    exact_mappings:
      - bpmn:auditing
    annotations:
      xml_name: auditing
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/AuditingImpl.java
    in_subset:
      - bpmn_semantic

  BpmnBaseElement:
    description: The base of nearly every BPMN element, giving it an id, documentation and
      extensions.
    abstract: true
    is_a: BpmnModelElementInstance
    exact_mappings:
      - bpmn:baseElement
    annotations:
      xml_name: baseElement
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/BaseElementImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      id:
        description: The element's id, unique within its document.
        range: string
        annotations:
          xml_name: id
          xml_id: 'true'
      documentation:
        description: Text that documents the element.
        range: BpmnDocumentation
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: documentation
      extension_elements:
        description: The element's extension content, such as Fluxnova's settings.
        range: BpmnExtensionElements
        inlined: true
        annotations:
          xml_name: extensionElements

  BpmnBoundaryEvent:
    description: An event attached to the boundary of an activity, which can interrupt it.
    is_a: BpmnCatchEvent
    exact_mappings:
      - bpmn:boundaryEvent
    annotations:
      xml_name: boundaryEvent
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/BoundaryEventImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      cancel_activity:
        description: Whether the event, when it fires, interrupts the activity it is attached
          to.
        range: boolean
        ifabsent: 'true'
        annotations:
          xml_name: cancelActivity
      attached_to_ref:
        description: The QName of the activity this event is attached to.
        range: string
        required: true
        annotations:
          xml_name: attachedToRef
          refers_to: BpmnActivity
          reference_kind: qname

  BpmnBusinessRuleTask:
    description: A task that hands data to a business rules engine and receives its result.
    is_a: BpmnTask
    exact_mappings:
      - bpmn:businessRuleTask
    annotations:
      xml_name: businessRuleTask
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/BusinessRuleTaskImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      implementation:
        description: The technology that runs the task, as a URI; the engine reads its own
          settings instead.
        range: string
        ifabsent: string(##unspecified)
        annotations:
          xml_name: implementation
      fluxnova_class:
        description: The Java class the engine instantiates to run the element.
        range: string
        exact_mappings:
          - fluxnova:class
          - camunda:class
        annotations:
          xml_name: class
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_delegate_expression:
        description: An expression that gives the delegate object the engine calls.
        range: string
        exact_mappings:
          - fluxnova:delegateExpression
          - camunda:delegateExpression
        annotations:
          xml_name: delegateExpression
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_expression:
        description: An expression the engine evaluates to run the element.
        range: string
        exact_mappings:
          - fluxnova:expression
          - camunda:expression
        annotations:
          xml_name: expression
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_result_variable:
        description: The variable the result is stored in.
        range: string
        exact_mappings:
          - fluxnova:resultVariable
          - camunda:resultVariable
        annotations:
          xml_name: resultVariable
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_topic:
        description: The topic of the external task the element creates.
        range: string
        exact_mappings:
          - fluxnova:topic
          - camunda:topic
        annotations:
          xml_name: topic
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_type:
        description: The element's type, such as external for an external task or the form
          field's value type.
        range: string
        exact_mappings:
          - fluxnova:type
          - camunda:type
        annotations:
          xml_name: type
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_decision_ref:
        description: The key of the decision to evaluate.
        range: string
        exact_mappings:
          - fluxnova:decisionRef
          - camunda:decisionRef
        annotations:
          xml_name: decisionRef
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_decision_ref_binding:
        description: Which version of the decision to use.
        range: string
        exact_mappings:
          - fluxnova:decisionRefBinding
          - camunda:decisionRefBinding
        annotations:
          xml_name: decisionRefBinding
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_decision_ref_version:
        description: The version of the decision, when the binding asks for one.
        range: string
        exact_mappings:
          - fluxnova:decisionRefVersion
          - camunda:decisionRefVersion
        annotations:
          xml_name: decisionRefVersion
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_decision_ref_version_tag:
        description: The version tag of the decision, when the binding asks for one.
        range: string
        exact_mappings:
          - fluxnova:decisionRefVersionTag
          - camunda:decisionRefVersionTag
        annotations:
          xml_name: decisionRefVersionTag
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_decision_ref_tenant_id:
        description: The tenant whose decision to use.
        range: string
        exact_mappings:
          - fluxnova:decisionRefTenantId
          - camunda:decisionRefTenantId
        annotations:
          xml_name: decisionRefTenantId
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_map_decision_result:
        description: How the decision's result is mapped into a variable.
        range: string
        exact_mappings:
          - fluxnova:mapDecisionResult
          - camunda:mapDecisionResult
        annotations:
          xml_name: mapDecisionResult
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_task_priority:
        description: The priority of the external tasks the element creates.
        range: string
        exact_mappings:
          - fluxnova:taskPriority
          - camunda:taskPriority
        annotations:
          xml_name: taskPriority
          xml_namespace: http://camunda.org/schema/1.0/bpmn

  BpmnCallActivity:
    description: An activity that calls a separate process or global task.
    is_a: BpmnActivity
    exact_mappings:
      - bpmn:callActivity
    annotations:
      xml_name: callActivity
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/CallActivityImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      called_element:
        description: The id of the process or global task this activity calls.
        range: string
        annotations:
          xml_name: calledElement
      fluxnova_async:
        description: Whether the engine continues asynchronously before the element; superseded
          by asyncBefore.
        range: boolean
        ifabsent: 'false'
        exact_mappings:
          - fluxnova:async
          - camunda:async
        annotations:
          xml_name: async
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_called_element_binding:
        description: Which version of the called process to use, such as the latest or the
          one deployed with this one.
        range: string
        exact_mappings:
          - fluxnova:calledElementBinding
          - camunda:calledElementBinding
        annotations:
          xml_name: calledElementBinding
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_called_element_version:
        description: The version of the called process, when the binding asks for one.
        range: string
        exact_mappings:
          - fluxnova:calledElementVersion
          - camunda:calledElementVersion
        annotations:
          xml_name: calledElementVersion
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_called_element_version_tag:
        description: The version tag of the called process, when the binding asks for one.
        range: string
        exact_mappings:
          - fluxnova:calledElementVersionTag
          - camunda:calledElementVersionTag
        annotations:
          xml_name: calledElementVersionTag
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_case_ref:
        description: The key of the case definition to call.
        range: string
        exact_mappings:
          - fluxnova:caseRef
          - camunda:caseRef
        annotations:
          xml_name: caseRef
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_case_binding:
        description: Which version of the called case to use.
        range: string
        exact_mappings:
          - fluxnova:caseBinding
          - camunda:caseBinding
        annotations:
          xml_name: caseBinding
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_case_version:
        description: The version of the called case, when the binding asks for one.
        range: string
        exact_mappings:
          - fluxnova:caseVersion
          - camunda:caseVersion
        annotations:
          xml_name: caseVersion
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_called_element_tenant_id:
        description: The tenant whose called process to use.
        range: string
        exact_mappings:
          - fluxnova:calledElementTenantId
          - camunda:calledElementTenantId
        annotations:
          xml_name: calledElementTenantId
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_case_tenant_id:
        description: The tenant whose called case to use.
        range: string
        exact_mappings:
          - fluxnova:caseTenantId
          - camunda:caseTenantId
        annotations:
          xml_name: caseTenantId
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_variable_mapping_class:
        description: The Java class that maps variables into and out of the called process.
        range: string
        exact_mappings:
          - fluxnova:variableMappingClass
          - camunda:variableMappingClass
        annotations:
          xml_name: variableMappingClass
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_variable_mapping_delegate_expression:
        description: An expression giving the delegate that maps variables into and out of
          the called process.
        range: string
        exact_mappings:
          - fluxnova:variableMappingDelegateExpression
          - camunda:variableMappingDelegateExpression
        annotations:
          xml_name: variableMappingDelegateExpression
          xml_namespace: http://camunda.org/schema/1.0/bpmn

  BpmnCallConversation:
    description: A conversation that calls a collaboration or global conversation defined
      elsewhere.
    is_a: BpmnConversationNode
    exact_mappings:
      - bpmn:callConversation
    annotations:
      xml_name: callConversation
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/CallConversationImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      called_collaboration_ref:
        description: The QName of the collaboration or global conversation this conversation
          calls.
        range: string
        annotations:
          xml_name: calledCollaborationRef
          refers_to: BpmnGlobalConversation
          reference_kind: qname
      participant_associations:
        description: The links between participants and those in called collaborations.
        range: BpmnParticipantAssociation
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: participantAssociation

  BpmnCallableElement:
    description: An element another process can call, such as a process.
    is_a: BpmnRootElement
    exact_mappings:
      - bpmn:callableElement
    annotations:
      xml_name: callableElement
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/CallableElementImpl.java
    in_subset:
      - bpmn_semantic
    attributes:
      name:
        description: The element's name.
        range: string
        annotations:
          xml_name: name
      supported_interface_refs:
        description: The QNames of the interfaces the element supports.
        range: string
        multivalued: true
        annotations:
          xml_name: supportedInterfaceRef
          refers_to: BpmnInterface
          reference_kind: qname
      io_specification:
        description: The element's data inputs and outputs.
        range: BpmnIoSpecification
        inlined: true
        annotations:
          xml_name: ioSpecification
      io_bindings:
        description: How the element's operations map to its input and output sets.
        range: BpmnIoBinding
        inlined: true
        multivalued: true
        inlined_as_list: true
        annotations:
          xml_name: ioBinding

  BpmnCancelEventDefinition:
    description: The trigger of an event that cancels a transaction sub-process.
    is_a: BpmnEventDefinition
    exact_mappings:
      - bpmn:cancelEventDefinition
    annotations:
      xml_name: cancelEventDefinition
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/CancelEventDefinitionImpl.java
    in_subset:
      - bpmn_semantic

  BpmnCatchEvent:
    description: An event that waits for a trigger, such as a start or intermediate catch
      event.
    abstract: true
    is_a: BpmnEvent
    exact_mappings:
      - bpmn:catchEvent
    annotations:
      xml_name: catchEvent
      xml_namespace: http://www.omg.org/spec/BPMN/20100524/MODEL
      source_file: model-api/bpmn-model/src/main/java/org/finos/fluxnova/bpm/model/bpmn/impl/instance/CatchEventImpl.java
    in_subset:
      - bpmn_semantic
