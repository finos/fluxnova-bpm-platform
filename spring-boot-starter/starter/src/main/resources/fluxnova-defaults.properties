# Default Liquibase changelog shipped with the Fluxnova engine.
# Wrapper projects can override spring.liquibase.change-log in their own
# application.yml/properties to point at a master changelog that includes this one.
spring.liquibase.change-log=classpath:org/finos/fluxnova/bpm/engine/db/liquibase/fluxnova-changelog.xml
# Liquibase is disabled by default; users must explicitly enable it in their application.yml/properties to use this feature.
spring.liquibase.enabled=false