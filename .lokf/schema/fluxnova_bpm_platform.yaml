    - engine_repository
    annotations:
      sql_table: ACT_RE_CAMFORMDEF
  FluxnovaGroup:
    description: Represents a group, used in IdentityService.
    slots:
    - id
    - fluxnova_bpm_platform_name
    - fluxnova_bpm_platform_type
    in_subset:
    - engine_identity
    annotations:
      sql_table: ACT_ID_GROUP
    is_a: Concept
  FluxnovaHistoricActivityInstance:
    description: Represents one execution of an activity and it's stored permanent for statistics, audit
      and other business intelligence purposes.
    is_a: FluxnovaHistoricScopeInstance
    slots:
    - parent_activity_instance_id
    - execution_id
    - activity_id
    - task_id
    - called_process_instance_id
    - called_case_instance_id
    - activity_name
    - activity_type
    - assignee
    - activity_instance_state
    - sequence_counter
    - tenant_id
    slot_usage:
      process_definition_id:
        required: true
      process_instance_id:
        required: true
      execution_id:
        required: true
      activity_id:
        required: true
      start_time:
        required: true
      activity_instance_state:
        minimum_value: 0
        maximum_value: 4
        comments:
        - 'Codes, from engine/impl/pvm/runtime/ActivityInstanceState.java: 0 default, 1 scope complete,
          2 canceled, 3 starting, 4 ending.'
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_ACTINST
  FluxnovaHistoricBatch:
    description: Historic representation of a Batch.
    slots:
    - id
    - fluxnova_bpm_platform_type
    - total_jobs
    - jobs_per_seed
    - invocations_per_job
    - seed_job_definition_id
    - monitor_job_definition_id
    - batch_job_definition_id
    - tenant_id
    - create_user_id
    - start_time
    - end_time
    - removal_time
    - execution_start_time
    slot_usage:
      start_time:
        required: true
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_BATCH
    is_a: Concept
  FluxnovaHistoricCaseActivityInstance:
    description: Represents one execution of a case activity which is stored permanent for statistics,
