      sql_column: SUPER_PROCESS_INSTANCE_ID_
  suspension_state:
    range: integer
    description: Whether the entity is active or suspended.
    annotations:
      sql_column: SUSPENSION_STATE_
  task_definition_key:
    range: string
    description: The id of the activity in the process defining this task or null if this is not related
      to a process.
    annotations:
      sql_column: TASK_DEF_KEY_
  task_id:
    range: string
    description: Reference to the task.
  task_state:
    range: string
    description: Task's state.
    annotations:
      sql_column: TASK_STATE_
  tenant_id:
    range: string
    description: Multi-tenancy discriminator.
  text2_value:
    range: string
    description: Variable value stored as text2.
    annotations:
      sql_column: TEXT2_
  text_value:
    range: string
    description: Variable value stored as text.
    annotations:
      sql_column: TEXT_
  fluxnova_bpm_platform_timestamp:
    range: datetime
    description: Time when this log occurred.
    annotations:
      sql_column: TIMESTAMP_
    slot_uri: fluxnova_bpm_platform:timestamp
    aliases:
    - timestamp
  topic_name:
    range: string
    description: Topic name of the associated external task.
    annotations:
      sql_column: TOPIC_NAME_
  total_jobs:
    range: integer
    description: Total number of jobs.
    annotations:
      sql_column: TOTAL_JOBS_
  fluxnova_bpm_platform_type:
    range: string
    description: Type discriminator.
    slot_uri: fluxnova_bpm_platform:type
    aliases:
    - type
  updated_at:
    range: datetime
    description: Timestamp for updated at.
    annotations:
      sql_column: UPDATED_AT_
  updated_by:
    range: string
    description: The updated by.
    annotations:
      sql_column: UPDATED_BY_
  fluxnova_bpm_platform_url:
    range: string
    description: The remote URL in case this is remote content.
    annotations:
      sql_column: URL_
    slot_uri: fluxnova_bpm_platform:url
    aliases:
    - url
  user_id:
    range: string
    description: Reference to a user.
  value:
    range: string
    description: Value of this variable instance.
    annotations:
      sql_column: VALUE_
  variable_event:
    range: string
    description: The variable event.
    annotations:
      sql_column: VARIABLE_EVENT_
  variable_instance_id:
    range: string
    description: Reference to the variable instance.
    annotations:
      sql_column: VAR_INST_ID_
  variable_name:
    range: string
    description: The name of the output variable.
    annotations:
      sql_column: VAR_NAME_
  variable_scope_id:
    range: string
    required: true
    description: Reference to the variable scope.
    annotations:
      sql_column: VAR_SCOPE_
  variable_type:
    range: string
    description: The variable type.
    annotations:
      sql_column: VAR_TYPE_
  fluxnova_bpm_platform_version:
    range: integer
    description: Version number.
    slot_uri: fluxnova_bpm_platform:version
    aliases:
    - version
  version_tag:
    range: string
    description: Version tag of the process definition.
    annotations:
      sql_column: VERSION_TAG_
  worker_id:
    range: string
    description: Id of the worker that fetched the external task most recently.
    annotations:
      sql_column: WORKER_ID_
  deployments:
    range: FluxnovaDeployment
    multivalued: true
    inlined_as_list: true
    description: Deployed resources.
  process_definitions:
    range: FluxnovaProcessDefinition
    multivalued: true
    inlined_as_list: true
    description: Process definitions.
  executions:
    range: FluxnovaExecution
    multivalued: true
    inlined_as_list: true
    description: Process execution instances.
  tasks:
    range: FluxnovaTask
    multivalued: true
    inlined_as_list: true
    description: User tasks.
  jobs:
    range: FluxnovaJob
    multivalued: true
    inlined_as_list: true
    description: Asynchronous jobs.
  users:
    range: FluxnovaUser
    multivalued: true
    inlined_as_list: true
    description: Identity users.
  groups:
    range: FluxnovaGroup
    multivalued: true
    inlined_as_list: true
    description: Identity groups.
  batches:
    range: FluxnovaBatch
    multivalued: true
    inlined_as_list: true
    description: Batch operations.
classes:
  FluxnovaAttachment:
    description: Any type of content that is be associated with a task or with a process instance.
    slots:
    - id
    - user_id
    - fluxnova_bpm_platform_name
    - fluxnova_bpm_platform_description
    - fluxnova_bpm_platform_type
    - task_id
    - root_process_instance_id
    - process_instance_id
    - fluxnova_bpm_platform_url
    - content_id
    - tenant_id
    - create_time
    - removal_time
    - created_by
    in_subset:
    - engine_collaboration
    annotations:
      sql_table: ACT_HI_ATTACHMENT
    is_a: Concept
  FluxnovaAuthorization:
    description: An Authorization assigns a set of Permissions to an identity to interact with a given
      Resource.
    slots:
    - id
    - fluxnova_bpm_platform_type
    - group_id
    - user_id
    - resource_type
    - resource_id
    - permissions
    - removal_time
    - root_process_instance_id
    slot_usage:
      fluxnova_bpm_platform_type:
        range: integer
        required: true
        minimum_value: 0
        maximum_value: 2
        comments:
        - 'Codes, from engine/authorization/Authorization.java: 0 global, 1 grant, 2 revoke.'
    in_subset:
    - engine_identity
    annotations:
      sql_table: ACT_RU_AUTHORIZATION
    is_a: Concept
  FluxnovaBatch:
    description: A batch represents a number of jobs which execute a number of commands asynchronously.
    slots:
    - id
    - fluxnova_bpm_platform_type
    - total_jobs
    - jobs_created
    - jobs_per_seed
    - invocations_per_job
    - seed_job_definition_id
    - batch_job_definition_id
    - monitor_job_definition_id
    - suspension_state
    - configuration
    - tenant_id
    - create_user_id
    - start_time
    - execution_start_time
    slot_usage:
      seed_job_definition_id:
        range: FluxnovaJobDefinition
      batch_job_definition_id:
        range: FluxnovaJobDefinition
      monitor_job_definition_id:
        range: FluxnovaJobDefinition
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
        - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2 suspended.'
    in_subset:
    - engine_job
    annotations:
      sql_table: ACT_RU_BATCH
    is_a: Concept
  FluxnovaByteArray:
    description: Byte Array entity in the engine infrastructure.
    slots:
    - id
    - fluxnova_bpm_platform_name
    - deployment_id
    - bytes
    - is_generated
    - tenant_id
    - fluxnova_bpm_platform_type
    - create_time
    - root_process_instance_id
    - removal_time
    slot_usage:
      fluxnova_bpm_platform_type:
        range: integer
      deployment_id:
        range: FluxnovaDeployment
    in_subset:
    - engine_base
    annotations:
      sql_table: ACT_GE_BYTEARRAY
    is_a: Concept
  FluxnovaCaseDefinition:
    description: A deployed case definition in the process repository.
    is_a: FluxnovaResourceDefinition
    slot_usage:
      key:
        required: true
      fluxnova_bpm_platform_version:
        required: true
    in_subset:
    - engine_repository
    annotations:
      sql_table: ACT_RE_CASE_DEF
  FluxnovaCaseExecution:
    description: Case Execution entity in the process execution runtime.
    slots:
    - id
    - case_instance_id
    - super_case_execution_id
    - super_execution_id
    - business_key
    - parent_id
    - case_definition_id
    - activity_id
    - previous_state
    - current_state
    - is_required
    - tenant_id
    slot_usage:
      case_instance_id:
        range: FluxnovaCaseExecution
      parent_id:
        range: FluxnovaCaseExecution
      case_definition_id:
        range: FluxnovaCaseDefinition
      previous_state:
        minimum_value: 0
        maximum_value: 14
        comments:
        - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available, 2 enabled,
          3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed, 9 closed, 10 terminating
          on termination, 11 terminating on parent termination, 12 terminating on exit, 13 suspending
          on suspension, 14 suspending on parent suspension.'
      current_state:
        minimum_value: 0
        maximum_value: 14
        comments:
        - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available, 2 enabled,
          3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed, 9 closed, 10 terminating
          on termination, 11 terminating on parent termination, 12 terminating on exit, 13 suspending
          on suspension, 14 suspending on parent suspension.'
    in_subset:
    - engine_runtime
    annotations:
      sql_table: ACT_RU_CASE_EXECUTION
    is_a: Concept
  FluxnovaCaseSentryPart:
    description: Case Sentry Part entity in the process execution runtime.
    slots:
    - id
    - case_instance_id
    - case_execution_id
    - sentry_id
    - fluxnova_bpm_platform_type
    - source_case_execution_id
    - standard_event
    - fluxnova_bpm_platform_source
    - variable_event
    - variable_name
    - is_satisfied
    - tenant_id
    slot_usage:
      case_instance_id:
        range: FluxnovaCaseExecution
      case_execution_id:
        range: FluxnovaCaseExecution
    in_subset:
    - engine_runtime
    annotations:
      sql_table: ACT_RU_CASE_SENTRY_PART
    is_a: Concept
  FluxnovaComment:
    description: User comments that form discussions around tasks.
    slots:
    - id
    - fluxnova_bpm_platform_type
    - event_time
    - user_id
    - task_id
    - root_process_instance_id
    - process_instance_id
    - action
    - message
    - full_message
    - tenant_id
    - removal_time
    in_subset:
    - engine_collaboration
    annotations:
      sql_table: ACT_HI_COMMENT
    is_a: Concept
  FluxnovaConfiguration:
    description: 'A process configuration entry: a key/value pair which is either global or scoped to
      a single tenant.'
    slots:
    - id
    - configuration_key
    - tenant_id
    - configuration_value
    - fluxnova_bpm_platform_version
    - fluxnova_bpm_platform_status
    - created_by
    - created_at
    - updated_by
    - updated_at
    slot_usage:
      fluxnova_bpm_platform_version:
        required: true
    in_subset:
    - engine_base
    annotations:
      sql_table: ACT_GE_CONFIGURATION
    is_a: Concept
  FluxnovaDecisionDefinition:
    description: Definition of a decision resource.
    is_a: FluxnovaResourceDefinition
    slots:
    - decision_requirements_definition_id
    - decision_requirements_definition_key
    - version_tag
    slot_usage:
      key:
        required: true
      fluxnova_bpm_platform_version:
        required: true
      decision_requirements_definition_id:
        range: FluxnovaDecisionRequirementsDefinition
    in_subset:
    - engine_repository
    annotations:
      sql_table: ACT_RE_DECISION_DEF
  FluxnovaDecisionRequirementsDefinition:
    description: Container of DecisionDefinitions which belongs to the same decision requirements graph
      (i.e. DMN resource).
    is_a: FluxnovaResourceDefinition
    slot_usage:
      key:
        required: true
      fluxnova_bpm_platform_version:
        required: true
    in_subset:
    - engine_repository
    annotations:
      sql_table: ACT_RE_DECISION_REQ_DEF
  FluxnovaDeployment:
    description: Represents a deployment that is already present in the process repository.
    slots:
    - id
    - fluxnova_bpm_platform_name
    - deploy_time
    - fluxnova_bpm_platform_source
    - tenant_id
    in_subset:
    - engine_repository
    annotations:
      sql_table: ACT_RE_DEPLOYMENT
    is_a: Concept
  FluxnovaEventSubscription:
    description: A message event subscription exists, if an Execution waits for an event like a message.
    slots:
    - id
    - event_type
    - event_name
    - execution_id
    - process_instance_id
    - activity_id
    - configuration
    - fluxnova_bpm_platform_created
    - tenant_id
    slot_usage:
      execution_id:
        range: FluxnovaExecution
    in_subset:
    - engine_runtime
    annotations:
      sql_table: ACT_RU_EVENT_SUBSCR
    is_a: Concept
  FluxnovaExecution:
    description: Represent a 'path of execution' in a process instance.
    slots:
    - id
    - root_process_instance_id
    - process_instance_id
    - business_key
    - parent_id
    - process_definition_id
    - super_execution_id
    - super_case_execution_id
    - case_instance_id
    - activity_instance_id
    - activity_id
    - is_active
    - is_concurrent
    - is_scope
    - is_event_scope
    - suspension_state
    - cached_entity_state
    - sequence_counter
    - tenant_id
    - process_definition_key
    slot_usage:
      process_instance_id:
        range: FluxnovaExecution
      parent_id:
        range: FluxnovaExecution
      process_definition_id:
        range: FluxnovaProcessDefinition
      super_execution_id:
        range: FluxnovaExecution
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
        - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2 suspended.'
    in_subset:
    - engine_runtime
    annotations:
      sql_table: ACT_RU_EXECUTION
    is_a: Concept
  FluxnovaExternalTask:
    description: Represents an instance of an external task that is created when a service-task like activity
      (i.e. service task, send task, ...) with attribute camunda:type="external" is executed.
    slots:
    - id
    - worker_id
    - topic_name
    - retries
    - error_message
    - error_details_id
    - lock_expiration_time
    - create_time
    - suspension_state
    - execution_id
    - process_instance_id
    - process_definition_id
    - process_definition_key
    - activity_id
    - activity_instance_id
    - tenant_id
    - priority
    - last_failure_log_id
    slot_usage:
      error_details_id:
        range: FluxnovaByteArray
      suspension_state:
        minimum_value: 1
        maximum_value: 2
        comments:
        - 'Codes, from engine/impl/persistence/entity/SuspensionState.java: 1 active, 2 suspended.'
      execution_id:
        range: FluxnovaExecution
    in_subset:
    - engine_runtime
    annotations:
      sql_table: ACT_RU_EXT_TASK
    is_a: Concept
  FluxnovaFilter:
    description: Filter entity in the user collaboration.
    slots:
    - id
    - resource_type
    - fluxnova_bpm_platform_name
