        - camunda:id
        annotations:
          xml_name: id
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      fluxnova_name:
        description: The option's label.
        range: string
        exact_mappings:
        - fluxnova:name
        - camunda:name
        annotations:
          xml_name: name
          xml_namespace: http://camunda.org/schema/1.0/bpmn
      text_content:
        description: The element's text, such as the body of an expression or a script.
        range: string
  FluxnovaPlatformData:
    description: Root container for Fluxnova BPM Platform data.
    slots:
    - deployments
    - process_definitions
    - executions
    - tasks
    - jobs
    - users
    - groups
    - batches
    slot_usage:
      deployments:
        range: FluxnovaDeployment
        multivalued: true
        inlined_as_list: true
      process_definitions:
        range: FluxnovaProcessDefinition
        multivalued: true
        inlined_as_list: true
      executions:
        range: FluxnovaExecution
        multivalued: true
        inlined_as_list: true
      tasks:
        range: FluxnovaTask
        multivalued: true
        inlined_as_list: true
      jobs:
        range: FluxnovaJob
        multivalued: true
        inlined_as_list: true
      users:
        range: FluxnovaUser
        multivalued: true
        inlined_as_list: true
      groups:
        range: FluxnovaGroup
        multivalued: true
        inlined_as_list: true
      batches:
        range: FluxnovaBatch
        multivalued: true
        inlined_as_list: true
enums:
  HistoricProcessInstanceState:
    description: The state a historic process instance records.
    comments:
    - Values from engine/history/HistoricProcessInstance.java.
    permissible_values:
      ACTIVE:
        description: The process instance is running.
      SUSPENDED:
        description: The process instance is suspended.
      COMPLETED:
        description: The process instance reached an end event.
      EXTERNALLY_TERMINATED:
        description: The process instance was ended from outside, such as through the REST API.
      INTERNALLY_TERMINATED:
        description: The process instance was ended from within, such as by a terminate end event.
  HistoricVariableInstanceState:
    description: Whether a historic variable instance still exists.
    comments:
    - Values from engine/history/HistoricVariableInstance.java.
    permissible_values:
      CREATED:
        description: The variable exists.
      DELETED:
        description: The variable was deleted.
  ConfigurationStatus:
    description: Whether a configuration entry is in effect.
    comments:
    - Values from engine/configuration/Configuration.java.
    permissible_values:
      ACTIVE:
        description: The entry is in effect.
      INACTIVE:
        description: A newer version of the entry replaced it.
      DELETED:
        description: The entry was deleted, and is kept.
  DelegationState:
    description: Where a delegated task stands.
    comments:
    - Values from engine/task/DelegationState.java.
    permissible_values:
      PENDING:
        description: The task was delegated and waits for the delegate to resolve it.
      RESOLVED:
        description: The delegate resolved the task and handed it back to its owner.
  BpmnMessageVisibleKind:
    description: Whether the message on a message flow is drawn as the one that starts the exchange.
    permissible_values:
      initiating:
        description: The message starts the exchange.
      non_initiating:
        description: The message answers one that started the exchange.
  BpmnParticipantBandKind:
    description: Where a participant band sits on a choreography activity, and whether its participant
      initiates.
    permissible_values:
      top_initiating:
        description: The top band, of the initiating participant.
      middle_initiating:
        description: A middle band, of the initiating participant.
      bottom_initiating:
        description: The bottom band, of the initiating participant.
      top_non_initiating:
        description: The top band, of a participant that does not initiate.
      middle_non_initiating:
        description: A middle band, of a participant that does not initiate.
      bottom_non_initiating:
        description: The bottom band, of a participant that does not initiate.
  BpmnAssociationDirection:
    description: Which ends of an association an arrow is drawn at.
    permissible_values:
      None:
        description: No arrow is drawn.
      One:
        description: An arrow points at the target.
      Both:
        description: Arrows point at both ends.
  BpmnEventBasedGatewayType:
    description: How an event-based gateway that starts a process waits for its events.
    permissible_values:
      Exclusive:
        description: The first event starts the instance, and the others are no longer waited for.
      Parallel:
        description: Each event starts an instance, or joins the one already started.
  BpmnGatewayDirection:
    description: Whether a gateway splits flows, joins them or does both.
    permissible_values:
      Unspecified:
        description: The model does not say.
      Converging:
        description: The gateway joins incoming flows into one.
      Diverging:
        description: The gateway splits one flow into several.
      Mixed:
        description: The gateway both joins and splits.
  BpmnItemKind:
    description: Whether an item is information or a physical thing.
    permissible_values:
      Information:
        description: The item is information.
      Physical:
        description: The item is a physical thing.
  BpmnMultiInstanceFlowCondition:
    description: When a multi-instance activity throws an event as its instances complete.
    permissible_values:
      None:
        description: An event is thrown for each instance that completes.
      One:
        description: An event is thrown when the first instance completes.
      All:
        description: No event is thrown.
      Complex:
        description: The complex behavior definitions decide which events are thrown.
  BpmnProcessType:
    description: Whether a process is private to its participant, public, or neither.
    permissible_values:
      None:
        description: The model does not say.
      Public:
        description: The process shows only what its participant exchanges with others.
      Private:
        description: The process is internal to its participant.
  BpmnRelationshipDirection:
    description: Which way a relationship points.
    permissible_values:
      None:
        description: It has no direction.
      Forward:
        description: From its sources to its targets.
      Backward:
        description: From its targets to its sources.
      Both:
        description: Both ways.
  BpmnTransactionMethod:
    description: How a transaction commits or cancels, by the three values BPMN keeps from BPMN 1.1.
    permissible_values:
      '##Compensate':
        description: The transaction is cancelled by compensation; the default.
        title: Compensate
      '##Image':
        description: The method BPMN 1.1 called image.
        title: Image
      '##Store':
        description: The method BPMN 1.1 called store.
        title: Store
subsets:
  engine_base:
    description: 'The general tables: stored bytes, properties, the schema log and the metrics logs.'
  engine_repository:
    description: 'The repository tables: deployments and the process, case, decision and form definitions
      in them.'
  engine_runtime:
    description: 'The runtime tables: executions, tasks, variables, event subscriptions, incidents and
      external tasks.'
  engine_job:
    description: 'The job tables: jobs, their definitions and batches.'
  engine_identity:
    description: 'The identity tables: users, groups, tenants, their memberships and authorizations.'
  engine_history:
    description: 'The history tables: what process, case and decision instances did, kept after they end.'
  engine_collaboration:
    description: 'The tables of what people add to tasks and process instances: comments, attachments
      and filters.'
  bpmn_dc:
    description: 'Diagram Common: the bounds, points and fonts diagrams use.'
  bpmn_di:
    description: 'Diagram Interchange: the generic diagrams, shapes and edges.'
  bpmn_bpmndi:
    description: 'BPMN Diagram Interchange: how a BPMN diagram lays its elements out.'
  bpmn_semantic:
    description: The BPMN 2.0 elements of a process, collaboration or definitions document.
  bpmn_extension:
    description: Fluxnova's extension elements, which sit in a BPMN element's extensionElements.
