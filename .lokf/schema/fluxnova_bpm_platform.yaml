    - query
    - properties
    slot_usage:
      resource_type:
        range: string
      fluxnova_bpm_platform_name:
        required: true
    in_subset:
    - engine_collaboration
    annotations:
      sql_table: ACT_RU_FILTER
    is_a: Concept
  FluxnovaFormDefinition:
