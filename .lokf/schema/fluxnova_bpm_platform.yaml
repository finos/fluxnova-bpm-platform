    - fluxnova_bpm_platform_timestamp
    - external_task_id
    - retries
    - topic_name
    - worker_id
    - priority
    - error_message
    - error_details_id
    - activity_id
    - activity_instance_id
    - execution_id
    - root_process_instance_id
    - process_instance_id
