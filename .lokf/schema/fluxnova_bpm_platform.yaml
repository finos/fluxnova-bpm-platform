    slots:
    - parent_activity_instance_id
    - case_definition_id
    - case_instance_id
    - case_activity_id
    - task_id
    - called_process_instance_id
    - called_case_instance_id
    - case_activity_name
    - case_activity_type
    - create_time
    - state
    - is_required
    - tenant_id
    slot_usage:
      case_definition_id:
        required: true
      case_instance_id:
        required: true
      create_time:
        required: true
      state:
        minimum_value: 0
        maximum_value: 14
        comments:
        - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available, 2 enabled,
          3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed, 9 closed, 10 terminating
          on termination, 11 terminating on parent termination, 12 terminating on exit, 13 suspending
          on suspension, 14 suspending on parent suspension.'
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_CASEACTINST
  FluxnovaHistoricCaseInstance:
    description: A single execution of a case definition that is stored permanently.
    is_a: FluxnovaHistoricScopeInstance
    slots:
    - case_instance_id
    - business_key
    - case_definition_id
    - create_time
    - close_time
    - state
    - create_user_id
    - super_case_instance_id
    - super_process_instance_id
    - tenant_id
    slot_usage:
      case_instance_id:
        required: true
      case_definition_id:
        required: true
      create_time:
        required: true
      state:
        minimum_value: 0
        maximum_value: 14
        comments:
        - 'Codes, from engine/impl/cmmn/execution/CaseExecutionState.java: 0 new, 1 available, 2 enabled,
          3 disabled, 4 active, 5 suspended, 6 terminated, 7 completed, 8 failed, 9 closed, 10 terminating
          on termination, 11 terminating on parent termination, 12 terminating on exit, 13 suspending
          on suspension, 14 suspending on parent suspension.'
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_CASEINST
  FluxnovaHistoricDecisionInputInstance:
    description: Represents one input variable of a decision evaluation.
    slots:
    - id
    - decision_instance_id
    - clause_id
    - clause_name
    - variable_type
    - byte_array_id
    - double_value
    - long_value
    - text_value
    - text2_value
    - tenant_id
    - create_time
    - root_process_instance_id
    - removal_time
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_DEC_IN
