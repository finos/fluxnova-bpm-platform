    - fluxnova_bpm_platform_type
    - user_id
    - group_id
    - task_id
    - root_process_instance_id
    - process_definition_id
    - operation_type
    - assigner_id
    - process_definition_key
    - tenant_id
    - removal_time
    slot_usage:
      fluxnova_bpm_platform_timestamp:
        required: true
    in_subset:
    - engine_history
    annotations:
      sql_table: ACT_HI_IDENTITYLINK
